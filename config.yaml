# Parámetros ajustables del pipeline. Las claves de API van en .env, nunca aquí.

video:
  width: 1920
  height: 1080
  fps: 30

paths:
  materials: materiales   # materiales/<slug>/{titulo.txt, guion.txt, voz.mp3}
  work: work              # work/<slug>/ — JSON intermedio de cada etapa
  out: out                # out/<slug>/ — entregables
  cache: cache            # caché global compartida entre vídeos

align:
  provider: local         # local (faster-whisper, gratis) | openai (whisper-1, de pago)
  model: medium           # tiny | base | small | medium | large-v3 (solo provider=local)
  language: es
  compute_type: int8
  # Una palabra del guion sin equivalente en el audio recibe tiempos interpolados.
  # Si el porcentaje de palabras alineadas cae por debajo de este umbral, la etapa falla:
  # probablemente el guion y la voz no corresponden.
  min_match_ratio: 0.80

planner:
  model: deepseek-flash
  thinking: false
  target_shot_seconds: 2.6   # ~23 cortes/min; los límites duros 1,5-4 s están en el esquema
  batch_size: 24             # planos por llamada al LLM
  parallel: 4
  max_attempts: 3            # reintentos si la salida no valida el esquema
  # Precio en horario punta (el valle es la mitad): https://api-docs.deepseek.com/quick_start/pricing
  usd_per_mtok: {input: 0.30, input_cache_hit: 0.006, output: 1.20}
