# Parámetros ajustables del pipeline. Las claves de API van en .env, nunca aquí.

video:
  width: 1920
  height: 1080
  fps: 30

paths:
  materials: materiales   # materiales/<slug>/{titulo.txt, guion.txt, voz.mp3}
  work: work              # work/<slug>/ — JSON intermedio de cada etapa
  out: out                # out/<slug>/ — entregables
  cache: cache            # caché global compartida entre vídeos

align:
  provider: local         # local (faster-whisper, gratis) | openai (whisper-1, de pago)
  model: medium           # tiny | base | small | medium | large-v3 (solo provider=local)
  language: es
  compute_type: int8
  # Una palabra del guion sin equivalente en el audio recibe tiempos interpolados.
  # Si el porcentaje de palabras alineadas cae por debajo de este umbral, la etapa falla:
  # probablemente el guion y la voz no corresponden.
  min_match_ratio: 0.80

planner:
  model: deepseek-flash
  thinking: false
  target_shot_seconds: 2.6   # ~23 cortes/min; los límites duros 1,5-4 s están en el esquema
  batch_size: 24             # planos por llamada al LLM
  parallel: 4
  max_attempts: 3            # reintentos si la salida no valida el esquema
  # Precio en horario punta (el valle es la mitad): https://api-docs.deepseek.com/quick_start/pricing
  usd_per_mtok: {input: 0.30, input_cache_hit: 0.006, output: 1.20}

factcheck:                   # verificación de datos del guion → out/<slug>/verificacion.md
  model: deepseek-flash
  thinking: false
  block_on_wrong: false      # true = no sigue con el vídeo si algún dato parece incorrecto
  usd_per_mtok: {input: 0.30, input_cache_hit: 0.006, output: 1.20}

sourcing:
  parallel: 4                  # planos procesados a la vez
  youtube:
    enabled: true
    queries_en: 2              # búsquedas por plano (de las 3-5 en inglés del planner)
    queries_local: 1           # + búsquedas en el idioma del guion
    results_per_query: 8
    videos_per_shot: 3         # vídeos por plano de los que se baja el storyboard (miniaturas)
    concurrency: 3             # peticiones simultáneas a YouTube
    rate_backoff: 20           # s de pausa (x3 en cada reintento) cuando YouTube responde 429
    min_duration: 30           # s — descarta clips sueltos
    max_duration: 3600         # s — descarta directos y maratones
    min_height: 720            # resolución mínima disponible del original
    min_interval: 1.0          # s entre peticiones a YouTube
    rate_limit: null           # límite de descarga, p. ej. "2M"
    sleep_requests: 0          # s entre peticiones HTTP internas de yt-dlp
    cookies_from_browser: null # "chrome", "firefox", "edge"... (solo en local)
    cookies_file: ~/.config/edit-vid3/youtube-cookies.txt   # si existe; o YOUTUBE_COOKIES_B64 en el entorno
    player_client: null        # p. ej. [android_vr] si YouTube cambia algo
  images:
    max_per_shot: 6
    min_width: 1280
    min_aspect: 1.2            # ancho/alto; descarta verticales
    wikimedia: {enabled: true, queries_per_shot: 3, min_interval: 0.5}
    openverse: {enabled: true, queries_per_shot: 1, min_interval: 3.2, min_width: 1024}   # anónimo: 20/min, 200/día; Flickr llega a 1024 px
    pixabay: {enabled: true, queries_per_shot: 1, min_interval: 1.0}     # necesita PIXABAY_API_KEY
    # Fotos web de las personas/eventos nombrados (como Google Imágenes). Con SERPER_API_KEY usa Google
    # Imágenes vía Serper; sin clave, DuckDuckGo (funciona desde casa; desde servidores devuelve basura
    # y el filtro de nombre la descarta). Son fotos de prensa sin licencia libre: se acreditan con la web.
    web: {enabled: true, queries_per_shot: 2, results: 20, min_width: 800, min_interval: 1.5}

analysis:
  model: ViT-B-32                  # OpenCLIP; ~28 fotogramas/s en 4 núcleos de CPU
  pretrained: laion2b_s34b_b79k
  batch_size: 64
  precompute_during_sourcing: true   # calcula las huellas CLIP en segundo plano durante el sourcing
  edge_margin: 0.05                # ignora el primer y el último 5 % de cada vídeo (intros/outros)
  max_frames_per_video: 40         # miniaturas del storyboard codificadas por vídeo (pasada gruesa)
  dedupe_difference: 4             # miniaturas consecutivas casi iguales se codifican una vez
  moments_per_video: 2             # mejores momentos por vídeo en la pasada gruesa
  fine_windows: 2                  # ventanas por plano que se descargan a 360p (pasada fina)
  extra_windows_with_entities: 1   # +1 si el plano nombra un lugar/persona/marca concreta
  window_padding: 2.0              # s alrededor del momento elegido
  fine_sample_seconds: 1.0         # un fotograma por segundo dentro de la ventana
  scene_threshold: 27              # PySceneDetect ContentDetector
  min_span_seconds: 1.2            # sub-planos más cortos no se usan
  ocr_side: 480                    # lado mayor para detectar texto (más = más lento)
  max_text_area: 0.08              # descarta fragmentos con más texto en pantalla
  max_text_area_image: 0.12
  talking_head_face_area: 0.05     # cara centrada que ocupa más de esto → presentador
  frozen_difference: 0.5
  min_clip: 0.20                   # por debajo, la opción se marca "poco relevante"
  min_clip_entity: 0.15            # umbral si la fuente nombra la entidad del plano (CLIP no conoce lugares concretos)
  weights: {clip: 1.0, entity: 0.10, sharpness: 0.02, motion: 0.01}

judge:
  hook_seconds: 30                 # los planos del gancho pasan siempre por el juez (más exigente)
  # Canales oficiales: +trusted_bonus a sus fragmentos (mejor calidad, títulos fiables). Ojo: son también
  # los que más reclaman por Content ID. Coincide si el canal contiene TODAS las palabras de alguno.
  trusted_channels: [Olympics, Olympic Games, Olympic Channel, FIG Gymnastics, World Athletics, Wanda Diamond League,
                     ISU Skating, European Athletics, European Gymnastics, USA Gymnastics, NBC Sports, Eurovision Sport]
  trusted_bonus: 0.03
  avoid_other_videos: true         # no reutilizar fragmentos/fotos ya usados en otros vídeos del canal (cache/used_fragments.json)
  all: true                        # el juez revisa todos los planos (~0,20 $/vídeo); false = solo los dudosos
  provider: openai                 # modelo CON visión; nunca deepseek-chat/flash (no ven imágenes)
  model: gpt-5-mini
  reasoning_effort: low
  detail: auto                     # resolución con la que el modelo ve la hoja de contactos
  margin: 0.02                     # duda si la 1.ª y la 2.ª opción están más cerca que esto…
  min_score: 0.30                  # …o si la mejor no llega a esta nota
  min_accept: 0.22                 # por debajo, la opción no se usa (→ fallback)
  candidates: 3                    # opciones que ve el juez por hoja
  rounds: 2                        # si rechaza todas, se le enseñan las 3 siguientes; si no, fallback
  parallel: 4
  source_bonus: {youtube: 0.02}    # prioridad: metraje de terceros antes que fotos
  max_phash_distance: 6            # fragmentos más parecidos que esto cuentan como repetidos
  # https://developers.openai.com/api/docs/pricing
  usd_per_mtok: {input: 0.25, output: 2.0}

ingest:
  format: "bv*[height<=1080][vcodec^=avc1]/bv*[height<=1080]/b[height<=1080]"   # HD del tramo elegido
  lut: assets/lut.cube             # LUT común; si no existe, se omite
  crf: 18                          # calidad x264 (menor = mejor)
  preset: veryfast
  parallel: 3

fallback:
  next_options: 3                  # tras una descarga fallida, siguientes opciones de la etapa 4 que se prueban
  pexels: true                     # vídeo y, si no, foto de Pexels (elegidos con CLIP)
  pexels_for_person: true          # en vídeos sobre una persona, Pexels solo si no queda NADA suyo (ni vídeo ni foto)
  min_clip: 0.22                   # parecido mínimo con el plano para aceptar algo de Pexels
  generate: true                   # último recurso: imagen generada
  image_model: gpt-image-2
  image_quality: medium
  # Estimación (OpenAI no publica aún el precio por imagen de gpt-image-2): se calcula con los tokens devueltos
  image_usd_per_mtok: {text_input: 5.0, image_output: 40.0}

content:
  # Fuentes cuyo título o canal contiene estos términos no se usan nunca (videojuegos, gameplay…)
  title_blocklist: [gta, gameplay, walkthrough, "let's play", lets play, playthrough, minecraft, roblox,
                    fortnite, red dead, videojuego, video game, sims 4, simulator, speedrun,
                    excel, microsoft word, powerpoint, google sheets, spreadsheet, hoja de cálculo, photoshop,
                    gymnast icons]   # canales de la competencia: su material ya está editado

ideas:
  my_channel: ""                   # tu canal, p. ej. "@TuCanal" (sus mejores vídeos también inspiran las ideas)
  competitors: ["@GymnastIcons"]   # canales de la competencia (añade los que quieras: @handle o URL)
  niches: [gimnasia, atletismo, patinaje artístico]
  videos_per_channel: 40           # últimos vídeos que se miran de cada canal
  min_ratio: 2.0                   # outlier = al menos 2x la mediana de visitas de su canal

lab:                               # panel (python main.py --panel) e ideas con la API de YouTube (YOUTUBE_API_KEYS en .env)
  units_per_key: 10000             # cuota diaria de cada clave (la de Google por defecto)
  queries:                         # búsquedas del nicho: botones rápidos del panel y fuente de las ideas diarias
    - historia gimnasta
    - gymnast story
    - gimnasia artística documental
    - figure skater story
    - historia patinaje artístico
    - track and field athlete story
    - historia atleta olímpico
    - olympic athlete documentary
  ideas_queries: 6                 # cuántas de ellas usa --ideas cada día (~160 unidades cada una)
  ideas_days: 180                  # solo vídeos de los últimos N días

shorts:                            # Shorts verticales sacados del vídeo final → out/<slug>/shorts/
  enabled: false                   # solo cuando tú lo pidas: python main.py --shorts <vídeo>
  count: 3
  min_seconds: 25
  max_seconds: 58
  zoom: 1.1                        # el plano 16:9 un poco más ancho que la pantalla

people:
  enabled: true                    # tarjeta de presentación (atleta recortado + nombre) la 1.ª vez que se le nombra
  max: 4                           # protagonista + hasta 3 personas con rótulo de nombre
  tries: 8                         # fotos que se prueban por persona hasta encontrar una recortable
  model: u2net_human_seg           # modelo de rembg para recortar personas

timeline:
  assets: assets                   # assets/music/*.mp3 (música de fondo) y assets/sfx/whoosh*.mp3, pop*.mp3
  music_volume: 0.25
  duck_db: 18                      # la música baja 18 dB mientras suena la voz
  whoosh_volume: 0.6
  pop_volume: 0.5
  questions: true                  # preguntas del guion (¿…?) como texto flotante en el centro
  question_merge_gap: 2.5          # preguntas a menos de 2,5 s salen juntas
  question_hold: 1.2               # s que el texto sigue tras la última palabra
  question_max_words: 30
  card_share: 0.25                 # parte de los clips panorámicos que van en tarjeta enmarcada (fotos y verticales, siempre)
  labels: true                     # rótulos abajo a la izquierda: nombres, lugar/fecha de cada tramo, notas
  label_seconds: 2.5
  moments: 2                       # momentos cumbre en los que la voz calla y suena el original (0 = ninguno)
  moment_seconds: 4.5              # duración de cada uno (máx. 5 s, clip de terceros)
  moment_volume: 1.0

qa:
  low_score: 0.30                  # planos elegidos sin juez por debajo de esta nota → a revisar
  low_confidence: 0.6              # veredictos del juez con menos confianza → a revisar
  max_phash_distance: 6            # imágenes más parecidas → posible repetición
  columns: 14                      # hoja de contactos

render:
  # Híbrido: los planos que son solo vídeo + crédito se montan con ffmpeg (rápido); el resto
  # (paneles, cifras, capítulos, fotos con Ken Burns) lo dibuja Remotion en una sola pasada.
  hybrid: true
  concurrency: 0                   # pestañas de Chrome para Remotion (0 = núcleos de la máquina)
  browser_executable: auto         # auto = Chromium preinstalado si existe; si no, Remotion descarga el suyo
  crf: 18
  preset: veryfast
  parallel: 3                      # segmentos de ffmpeg en paralelo
  loudness: -16                    # LUFS del máster (YouTube)
  true_peak: -1.5
  audio_bitrate: 192k
