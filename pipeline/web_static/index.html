<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de vídeos</title>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
</head>
<body>
<button class="skip" type="button" onclick="document.getElementById('app').focus()">Saltar al contenido</button>
<header id="top" class="hide">
  <a class="brand" href="#/"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></i>Estudio</a>
  <button class="burger icon" type="button" aria-label="Menú" aria-expanded="false" aria-controls="nav"
    onclick="this.setAttribute('aria-expanded', document.body.classList.toggle('menu'))"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <form role="search" onsubmit="event.preventDefault();const q=this.q.value.trim();if(q)location.hash='#/buscar/'+encodeURIComponent(q)">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input name="q" type="search" placeholder="¿Ya lo hice?" aria-label="¿Ya lo hice? Buscar en títulos y guiones"></form>
  <nav id="nav" aria-label="Principal">
    <a href="#/nuevo" class="newv"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Nuevo vídeo</a>
    <div class="sec">Producción</div>
    <a href="#/"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Inicio</a>
    <a href="#/subir"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4"/><path d="m6 10 6-6 6 6"/><path d="M4 20h16"/></svg>Para subir</a>
    <a href="#/videos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>Todos los vídeos</a>
    <a href="#/guiones"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>Guiones</a>
    <a href="#/calendario"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</a>
    <a href="#/tablero"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Tablero de ideas</a>
    <div class="sec">Crecer</div>
    <a href="#/competencia"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg>Radar</a>
    <a href="#/canal"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>Mi canal</a>
    <a href="#/estadisticas"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estadísticas</a>
    <a href="#/experimentos"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-6 10a2 2 0 0 0 1.7 3h12.6a2 2 0 0 0 1.7-3L14 9V3"/></svg>Experimentos</a>
    <a href="#/piloto"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-7z"/></svg>Piloto automático</a>
    <div class="sec">Sistema</div>
    <a href="#/biblioteca"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Biblioteca</a>
    <a href="#/errores"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V4h12l-1 4 1 4H4"/></svg>Clips marcados</a>
    <a href="#/gasto"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 6.5H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"/></svg>Gasto de API</a>
    <a href="#/servidor"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Estado del servidor</a>
    <a href="#/ajustes"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</a>
  </nav>
  <div class="foot"><span id="service"></span><a href="#" id="logout" onclick="event.preventDefault();logout()">Salir</a></div>
</header>
<main id="app" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>

<form id="login" class="card hide" onsubmit="event.preventDefault();login()">
  <h1>Estudio de vídeos</h1>
  <div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div>
  <div class="actions"><button class="main">Entrar</button><span id="loginmsg" class="muted small" role="alert"></span></div>
</form>

<script src="/static/js/core.js?v={{v}}"></script>
<script src="/static/js/paint.js?v={{v}}"></script>
<script src="/static/js/ui.js?v={{v}}"></script>
<script src="/static/js/home.js?v={{v}}"></script>
<script src="/static/js/video.js?v={{v}}"></script>
<script src="/static/js/grow.js?v={{v}}"></script>
<script src="/static/js/plan.js?v={{v}}"></script>
<script src="/static/js/system.js?v={{v}}"></script>
<script src="/static/js/app.js?v={{v}}"></script>
</body>
</html>
