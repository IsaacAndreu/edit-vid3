<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de vídeos</title>
<style>
  :root {
    --bg: #0b0f16; --panel: #121821; --panel2: #1a2230; --line: #243042; --text: #e8eef6; --muted: #8c99ab;
    --accent: #f5b301; --ok: #3fb950; --bad: #f85149; --work: #58a6ff; --wait: #a371f7;
    --radius: 14px; --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.18); --side: 248px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #e1e6ed; --text: #172030; --muted: #5d6878;
            --shadow: 0 1px 2px rgba(16,24,40,.05), 0 6px 18px rgba(16,24,40,.06); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--work); text-decoration: none; }
  ::selection { background: rgba(245,179,1,.35); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* --- navigation: a sidebar on a computer, a drawer on a phone --- */
  header { position: fixed; z-index: 10; top: 0; left: 0; bottom: 0; width: var(--side); background: var(--panel);
           border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; overflow-y: auto; }
  header .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  header .brand i { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), #ff7a00);
                    display: grid; place-items: center; font-style: normal; font-size: 16px; color: #1b1300; }
  header .burger { display: none; }
  header nav { display: flex; flex-direction: column; gap: 1px; }
  header nav .sec { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
                    padding: 16px 10px 6px; opacity: .8; }
  header nav a { color: var(--muted); padding: 7px 10px; border-radius: 9px; font-size: 14px; display: flex; gap: 10px; align-items: center;
                 transition: background .15s, color .15s; }
  header nav a .ic { width: 20px; text-align: center; flex: none; }
  header nav a:hover { color: var(--text); background: var(--panel2); }
  header nav a.on { color: var(--text); background: var(--panel2); font-weight: 650; box-shadow: inset 3px 0 0 var(--accent); }
  header nav a.newv { background: var(--accent); color: #1b1300; font-weight: 750; justify-content: center; margin: 2px 0 6px; padding: 9px 10px; box-shadow: none; }
  header nav a.newv:hover { filter: brightness(1.06); }
  header form { margin: 4px 0 2px; } header form input { padding: 8px 11px; font-size: 14px; }
  header .foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); }
  body.authed main { margin-left: var(--side); }
  @media (max-width: 1000px) {
    header { position: sticky; width: auto; bottom: auto; flex-direction: row; align-items: center; padding: 10px 14px; gap: 10px;
             border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    header .brand { padding: 0; }
    header .burger { display: inline-block; margin-left: auto; padding: 7px 12px; }
    header nav, header form, header .foot { display: none; }
    body.menu header { flex-wrap: wrap; }
    body.menu header nav, body.menu header form { display: flex; width: 100%; }
    body.menu header nav { max-height: 70vh; overflow-y: auto; padding-bottom: 8px; }
    body.menu header form input { width: 100%; }
    body.authed main { margin-left: 0; }
  }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; } h2 { font-size: 17px; margin: 26px 0 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card.click { cursor: pointer; } .card.click:hover { border-color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
          background: var(--panel2); color: var(--muted); }
  .pill.hecho { color: var(--ok); } .pill.error { color: var(--bad); } .pill.haciendo { color: var(--work); }
  .pill["en cola"], .pill.cola { color: var(--wait); } .pill.pausa { color: var(--muted, #888); }
  .stat { font-size: 26px; font-weight: 700; }
  .bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--work); border-radius: 99px; transition: width .4s; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
                 padding: 8px 14px; border-radius: 9px; cursor: pointer; display: inline-block; }
  button.main, .btn.main { background: var(--accent); color: #1b1300; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
                            border-radius: 9px; padding: 9px 11px; width: 100%; }
  textarea { min-height: 260px; resize: vertical; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; } label .muted { font-weight: 400; }
  .two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; } @media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; font-size: 14px; } td, th { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
  pre { background: var(--panel2); border-radius: 9px; padding: 12px; overflow: auto; max-height: 420px; font-size: 12.5px; white-space: pre-wrap; }
  video { width: 100%; border-radius: var(--radius); background: #000; max-height: 70vh; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 10px; }
  .tabs button.on { background: var(--text); color: var(--bg); }
  .md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md table { margin: 8px 0; } .md img { max-width: 100%; border-radius: 8px; }
  .thumbs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } .thumbs img { width: 100%; border-radius: 8px; }
  .notice { padding: 12px 14px; border-radius: 10px; background: var(--panel2); border-left: 4px solid var(--accent); margin: 12px 0; }
  .notice.bad { border-color: var(--bad); } .notice.ok { border-color: var(--ok); }
  .spend { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
  .spend div { flex: 1; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; position: relative; }
  .spend span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  #login { max-width: 360px; margin: 12vh auto; }
  .cal-day { margin: 16px 0 6px; font-weight: 700; } .cal-day.today { color: var(--accent); }
  .slot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px;
          background: var(--panel); border: 1px solid var(--line); margin: 6px 0; }
  .slot.gap { border-color: var(--bad); } .slot.ok { border-color: var(--ok); } .slot.past { opacity: .55; }
  .slot b { min-width: 110px; } .slot select { width: auto; padding: 5px 8px; }
  .days label { display: inline-flex; gap: 4px; align-items: center; margin: 0 8px 0 0; font-weight: 400; }
  .days input { width: auto; }
  .kanban { display: grid; gap: 12px; grid-template-columns: repeat(5, minmax(200px, 1fr)); overflow-x: auto; }
  .kanban .col { background: var(--panel2); border-radius: var(--radius); padding: 10px; min-height: 200px; }
  .kanban .col h3 { margin: 4px 4px 10px; font-size: 14px; }
  .kanban .item { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 13.5px; }
  .review { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .review .card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .review .card.correcta { border-color: var(--ok); } .review .card.incorrecta { border-color: var(--bad); } .review .card.dudosa { border-color: #d29922; }
  .review img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .review .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .review .quote { font-size: 14px; } .review .src { font-size: 12px; color: var(--muted); }
  .review .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .review .acts button { padding: 5px 10px; font-size: 13px; } .review select { width: auto; padding: 5px 8px; font-size: 13px; }
  .b-ok { background: #238636 !important; color: #fff !important; border-color: #238636 !important; }
  .b-bad { background: #da3633 !important; color: #fff !important; border-color: #da3633 !important; }
  .b-doubt { background: #9e6a03 !important; color: #fff !important; border-color: #9e6a03 !important; }
  .acts button.off { opacity: .45; }
  .vids { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .vids .card { padding: 0; overflow: hidden; } .vids img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .vids .body { padding: 10px 12px; } .big { font-size: 20px; font-weight: 800; color: var(--accent); }
  .chips { position: sticky; top: 0; z-index: 4; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chips a { white-space: nowrap; padding: 6px 14px; border-radius: 99px; background: var(--panel2); color: var(--text); font-size: 14px; }
  .kicker { color: var(--ok); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-top: 34px; }
  .heat { display: grid; grid-template-columns: 44px repeat(8, 1fr); gap: 5px; font-size: 12px; }
  .heat div { text-align: center; } .heat .c { aspect-ratio: 1.3; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; } .heat .c.few { outline: 1.5px dashed rgba(255,255,255,.45); outline-offset: -2px; } .heat .c.none { background: transparent; outline: 1px dashed var(--line); }
  .legend { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { width: 26px; height: 10px; border-radius: 4px; display: inline-block; }
  .months { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 18px; }
  .months > div { flex: 1; display: flex; flex-direction: column-reverse; position: relative; height: 100%; }
  .months b { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 12px; }
  .months .l { background: #3b82f6; border-radius: 4px 4px 0 0; } .months .s { background: #ea580c; border-radius: 4px 4px 0 0; }
  .months span { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .trait { padding: 10px 0; border-bottom: 1px solid var(--line); } .trait .row { justify-content: space-between; }
  .diverge { position: relative; height: 10px; background: var(--panel2); border-radius: 99px; margin-top: 6px; }
  .diverge::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
  .diverge i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
  .topic { display: grid; grid-template-columns: 28px 120px 1fr; gap: 12px; align-items: center; padding: 10px 0; }
  .topic img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; }
  .hbar { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 6px 0; } .hbar i { display: block; height: 100%; border-radius: 99px; }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 4vh 12px; }
  .modal > div { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); padding: 18px 18px 24px; }
  .idea { margin-top: 14px; } .idea h3 { margin: 0 0 6px; font-size: 17px; } .idea ol { margin: 6px 0; padding-left: 22px; }
  .idea p { margin: 6px 0; }
  .elf { background: #12301f; color: #d6f5e0; border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  @media (prefers-color-scheme: light) { .elf { background: #e5f6ea; color: #13361f; } }
  .hide { display: none !important; }
  #app.loading { opacity: .45; pointer-events: none; transition: opacity .2s; }
  /* --- inicio y buscador --- */
  .hero { display: flex; gap: 10px; align-items: stretch; margin-bottom: 18px; }
  .hero textarea { min-height: 48px; height: 48px; font-size: 16px; padding: 12px 14px; border-radius: 12px; resize: none; }
  .hero textarea:focus { height: 140px; outline: 2px solid var(--accent); }
  .hero button { white-space: nowrap; padding: 0 20px; border-radius: 12px; }
  .yt-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 10px; }
  .yt-tools input[type=search] { flex: 1 1 200px; max-width: 320px; }
  .yt-chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 99px; padding: 5px 12px;
    font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .yt-chip.on { background: var(--panel2); border-color: var(--accent); font-weight: 700; }
  .yt-chip .dot, .ytt .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .ytt { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
  .ytt th { position: sticky; top: 0; background: var(--panel); z-index: 1; padding: 9px 8px; font-size: 12px; font-weight: 600;
    color: var(--muted); text-align: right; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--line); }
  .ytt th:first-child, .ytt td:first-child { text-align: left; }
  .ytt th.on { color: var(--text); }
  .ytt td { padding: 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: middle; white-space: nowrap; }
  .ytt td:first-child { white-space: normal; min-width: 280px; }
  .ytt tr.v:hover td { background: var(--panel2); }
  .ytt tr.group td { background: var(--panel2); font-weight: 700; text-align: left; padding: 10px 8px; }
  .ytt .thumb { width: 104px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex: none; background: var(--panel2); }
  .ytt .vbar { height: 4px; border-radius: 0 2px 2px 0; background: var(--accent); margin-top: 4px; margin-left: auto; opacity: .75; }
  .ytt .sub { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
  @media (max-width: 760px) {
    .ytt thead { display: none; } .ytt, .ytt tbody, .ytt tr, .ytt td { display: block; width: 100%; }
    .ytt tr.v { border-bottom: 1px solid var(--line); padding: 8px 0; display: grid; grid-template-columns: repeat(3, 1fr); }
    .ytt tr.v td { border: 0; padding: 3px 8px; text-align: left; } .ytt tr.v td:first-child { grid-column: 1 / -1; }
    .ytt td[data-k]::before { content: attr(data-k); display: block; font-size: 11px; color: var(--muted); }
    .ytt td.wide { display: none; }
  }
  .kpis { display: grid; gap: 12px; grid-template-columns: repeat(4, 1fr); }
  @media (max-width: 820px) { .kpis { grid-template-columns: 1fr 1fr; } .hero { flex-direction: column; } .hero button { padding: 12px; } }
  /* the home on a phone: one strip says it all (state, making, failing, to upload); the big search and the cards go */
  .glance { display: none; }
  @media (max-width: 600px) {
    .home-search, .home-kpis { display: none; }
    .glance { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 12px; }
    .glance a { display: block; text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--panel);
      border: 1px solid var(--line); color: inherit; text-decoration: none; }
    .glance .n { font-size: 22px; font-weight: 800; line-height: 1.1; } .glance .l { font-size: 11px; color: var(--muted); }
    .glance a.bad { border-color: var(--bad); } .glance a.bad .n { color: var(--bad); }
  }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: block; color: var(--text); }
  a.kpi:hover { border-color: var(--muted); }
  .kpi .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
  .kpi .v { font-size: 26px; font-weight: 800; margin-top: 2px; } .kpi .d { font-size: 13px; color: var(--muted); }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 4px; }
  .chiprow button { padding: 5px 12px; border-radius: 99px; font-size: 13.5px; font-weight: 600; }
  .chiprow button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin-top: 16px; overflow: hidden; }
  .block > .bh { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .block > .bh b { font-size: 15.5px; } .block > .bh .count { color: var(--muted); font-weight: 600; margin-left: 6px; }
  .block.warn { border-color: var(--bad); } .block.now { border-color: var(--work); }
  .vrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px;
          border-bottom: 1px solid var(--line); cursor: pointer; color: var(--text); }
  .vrow:last-child { border-bottom: 0; } .vrow:hover { background: var(--panel2); }
  .vrow .t { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vrow .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vrow .r { text-align: right; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .vrow .bar { margin-top: 6px; }
  details.block > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; justify-content: space-between; }
  details.block > summary::-webkit-details-marker { display: none; }
  details.block[open] > summary { border-bottom: 1px solid var(--line); }
  details.block > summary::after { content: "▾"; color: var(--muted); } details.block[open] > summary::after { content: "▴"; }
  .hit mark { background: rgba(245,179,1,.3); color: inherit; border-radius: 3px; padding: 0 2px; }
  .upl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); margin: 10px 0; }
  .upl > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; padding: 12px 16px; }
  .upl > summary::-webkit-details-marker { display: none; }
  .upl[open] > summary { border-bottom: 1px solid var(--line); } .upl > .in { padding: 4px 16px 16px; }
  .daylabel { margin: 22px 0 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .daylabel.late { color: var(--bad); } .daylabel.today { color: var(--accent); }
  /* --- finish: one look for every page --- */
  main { max-width: 1240px; padding: 28px 28px 80px; }
  @media (max-width: 1000px) { main { padding: 18px 14px 60px; } .chips { top: 56px; } }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0 0 18px; }
  h2 { font-size: 13px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 30px 0 10px; }
  h3 { letter-spacing: -.01em; }
  .card, .block, .kpi, .upl, .slot { box-shadow: var(--shadow); }
  .card { border-radius: var(--radius); padding: 18px; }
  .card.click, a.kpi, .vrow, .vids .card { transition: border-color .15s, transform .15s, background .15s; }
  .card.click:hover, .vids .card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .kpi { border-radius: var(--radius); padding: 16px 18px; } .kpi .v { font-size: 28px; letter-spacing: -.02em; }
  .pill { padding: 3px 10px; font-weight: 650; letter-spacing: .01em; }
  .pill.hecho { background: color-mix(in srgb, var(--ok) 16%, transparent); }
  .pill.error { background: color-mix(in srgb, var(--bad) 16%, transparent); }
  .pill.haciendo { background: color-mix(in srgb, var(--work) 16%, transparent); }
  .pill.cola { background: color-mix(in srgb, var(--wait) 16%, transparent); }
  button, .btn { border-radius: 10px; transition: background .15s, border-color .15s, filter .15s, transform .05s; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--muted); }
  button:active:not(:disabled), .btn:active { transform: translateY(1px); }
  button.main:hover:not(:disabled), .btn.main:hover { filter: brightness(1.07); border-color: var(--accent); }
  input, select, textarea { border-radius: 10px; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  label { font-size: 14px; }

  .tabs { border-bottom: 1px solid var(--line); gap: 2px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); padding: 9px 12px; }
  .tabs button.on { background: none; color: var(--text); border-bottom-color: var(--accent); }

  .block > .bh { background: color-mix(in srgb, var(--panel2) 40%, transparent); }
  pre { border: 1px solid var(--line); }

</style>
</head>

</header>
<main id="app"></main>

<div id="login" class="card hide">

  <input id="pw" type="password" autocomplete="current-password">

</div>

<script>
const STAGES = {factcheck: "Verificar datos", align: "Alinear la voz", planner: "Planificar planos", sourcing: "Buscar material",
  analysis: "Analizar clips", judge: "Elegir (juez)", ingest: "Descargar en HD", people: "Personas", fallback: "Rellenar huecos",
  coldopen: "Apertura", timeline: "Montaje", qa: "Revisión", render: "Render", shorts: "Shorts", package: "Títulos y miniaturas"};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let timer = null, data = null;

async function api(path, options = {}) {
  const res = await fetch(path, {credentials: "same-origin", ...options});
  if (res.status === 401) { showLogin(); throw new Error("login"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

function showLogin() { $("#login").classList.remove("hide"); $("#top").classList.add("hide"); $("#app").innerHTML = ""; $("#pw").focus(); }
async function login() {
  try { await post("/api/login", {password: $("#pw").value}); $("#login").classList.add("hide"); start(); }
  catch (e) { $("#loginmsg").textContent = e.message; }
}
$("#pw").addEventListener("keydown", (e) => e.key === "Enter" && login());

function ago(iso) {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function mins(s) { return s == null ? "—" : s >= 60 ? `${(s / 60).toFixed(1)} min` : `${Math.round(s)} s`; }

// minimal markdown: headings, lists, tables, bold/italic, code, links, images (relative to the video's files)
function md(text, base) {
  if (!text) return '<p class="muted">Todavía no hay.</p>';
  const lines = esc(text).split("\n"); let html = "", inList = false, table = [], code = false;
  const inline = (t) => t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, a, src) => `<img alt="${a}" src="${/^https?:/.test(src) ? src : base + src.replace(/^\.?\//, "")}">`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\s)_([^_]+)_/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const flush = () => { if (inList) { html += "</ul>"; inList = false; }
    if (table.length) { html += "<table>" + table.filter((r) => !/^\|?\s*-{2,}/.test(r)).map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|")
      .map((c) => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>"; table = []; } };
  for (const line of lines) {
    if (line.startsWith("```")) { flush(); html += code ? "</pre>" : "<pre>"; code = !code; continue; }
    if (code) { html += line + "\n"; continue; }
    if (/^\s*\|/.test(line)) { table.push(line.trim()); continue; }
    if (/^\s*[-*] /.test(line)) { if (table.length) flush(); if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`; continue; }
    flush();
    const h = line.match(/^(#{1,4}) (.*)/);
    if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  flush(); return html;
}

function pill(status) { return `<span class="pill ${status === "en cola" ? "cola" : status === "en pausa" ? "pausa" : status}">${esc(status)}</span>`; }


const hue = (name) => { let h = 0; for (const c of String(name || "")) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const chColor = (name) => name ? `hsl(${hue(name)} 70% 58%)` : "var(--muted)";
let homeChannel = (() => { try { return localStorage.getItem("inicio:canal") || ""; } catch (e) { return ""; } })();

function vrow(v, right = "") {
  const st = v.stage;
  const sub = [v.title && v.title !== v.slug ? v.slug : "", v.channel, v.minutes ? v.minutes + " min" : "", v.costUsd ? v.costUsd + " $" : ""]
    .filter(Boolean).join(" · ");
  const extra = st ? `<div class="small" style="margin-top:4px;color:var(--work)">${st.number}/${st.of} · ${esc(STAGES[st.stage] || st.stage)} · desde hace ${ago(st.started)}</div>
      <div class="bar"><i style="width:${Math.round(100 * (st.number - 1) / st.of)}%"></i></div>`
    : v.error ? `<div class="small" style="color:var(--bad);margin-top:3px">${esc(String(v.error).slice(0, 160))}</div>`
    : v.voice ? `<div class="small muted" style="margin-top:3px">🎙️ ${v.voice === "generando" ? "generando la voz…" : "voz: " + esc(v.voice)}</div>`
    : v.lastError ? `<div class="small muted" style="margin-top:3px">↻ ${v.retryAt ? "reintento a las " + esc(v.retryAt) : "se reintenta en su turno"} · falló la última vez</div>` : "";
  return `<a class="vrow" href="#/video/${encodeURIComponent(v.slug)}"><span class="dot" style="background:${chColor(v.channel)}"></span>
    <div style="min-width:0"><div class="t">${esc(v.title || v.slug)}</div><div class="s">${esc(sub)}</div>${extra}</div>
    <div class="r">${right || pill(v.status)}</div></a>`;
}

function block(title, list, {cls = "", right = null, more = "", open = true, collapsible = false, limit = 0, id = ""} = {}) {
  if (!list.length) return "";
  const shown = limit ? list.slice(0, limit) : list;
  const rows = shown.map((v) => vrow(v, right ? right(v) : "")).join("")
    + (limit && list.length > limit ? `<div class="vrow" style="cursor:default"><span></span><span class="small muted">y ${list.length - limit} más…</span><span></span></div>` : "");
  const head = `<b>${title}<span class="count">${list.length}</span></b>${more ? `<span class="small">${more}</span>` : ""}`;
  const anchor = id ? ` id="${id}"` : "";
  return collapsible ? `<details${anchor} class="block ${cls}" ${open ? "open" : ""}><summary>${head}</summary>${rows}</details>`
    : `<div${anchor} class="block ${cls}"><div class="bh">${head}</div>${rows}</div>`;
}

let homeData = null;
async function home() {
  const [overview, dates] = await Promise.all([api("/api/overview"), api("/api/upload/dates").catch(() => ({}))]);
  homeData = {overview, dates};
  drawHome();
}
async function unholdHome(slug) {      // «en pausa» (taken out of the queue): «Reintentar todos» leaves it out
  await post(`/api/video/${encodeURIComponent(slug)}/unhold`, {}); route();
}

function drawHome() {               // the channel buttons redraw from what is already loaded: instant
  if (!homeData || !location.hash.match(/^(#\/?)?$/)) return;
  const {overview, dates} = homeData;
  data = overview;
  const s = data.service, b = data.budget;
  const all = data.videos.filter((v) => !v.archived);
  const channels = [...new Set(all.map((v) => v.channel).filter(Boolean))].sort();
  if (homeChannel && !channels.includes(homeChannel)) homeChannel = "";
  const vids = all.filter((v) => !homeChannel || v.channel === homeChannel);
  const by = (st) => vids.filter((v) => v.status === st);
  const toUpload = by("hecho").filter((v) => !v.published);
  const slot = dates || {};
  const today = new Date().toISOString().slice(0, 10);
  toUpload.sort((a, c) => ((slot[a.slug] || {}).date || "9999").localeCompare((slot[c.slug] || {}).date || "9999") || a.updated - c.updated);
  const uploaded = by("hecho").filter((v) => v.published)
    .sort((a, c) => String((c.published || {}).at || "").localeCompare(String((a.published || {}).at || "")));
  const queue = by("en cola").sort((a, c) => a.updated - c.updated);
  const attention = [...by("error"), ...by("incompleto"), ...by("en pausa")];
  const failed = all.filter((v) => (v.status === "error" || v.lastError) && !v.quotaWait).length;
  const state = s.youtubeBlocked ? ["⛔ YouTube bloqueado", `desde las ${esc(s.youtubeBlocked)} · prueba cada hora`]
    : s.paused ? ["⏸ En pausa", "no empieza vídeos nuevos"] : s.watching ? ["● Trabajando", s.queueRunning ? "haciendo la cola" : "vigilando: hace los vídeos solo"]
    : s.queueRunning ? ["▶ Cola en marcha", ""] : ["○ Parado", "sin vigilante"];
  const late = toUpload.filter((v) => (slot[v.slug] || {}).date && slot[v.slug].date < today).length;
  const when = (v) => { const d = (slot[v.slug] || {}).date; if (!d) return '<span class="muted">sin día</span>';
    return d < today ? `<span style="color:var(--bad)">⚠️ tocaba ${DAY(d)}</span>` : d === today ? `<b style="color:var(--accent)">hoy · ${esc(slot[v.slug].time || "")}</b>` : `📅 ${DAY(d)}`; };
  $("#app").innerHTML = `
    <div class="glance">
      <a href="#/servidor" class="${s.youtubeBlocked ? "bad" : ""}"><div class="n">${s.youtubeBlocked ? "⛔" : s.paused ? "⏸" : s.watching ? "●" : "○"}</div>
        <div class="l">${s.youtubeBlocked ? "YouTube bloquea" : s.paused ? "en pausa" : s.watching ? "trabajando" : "parado"}</div></a>
      <a href="javascript:void(0)" onclick="document.getElementById('h-now')?.scrollIntoView({behavior:'smooth'})"><div class="n">${all.filter((v) => v.status === "haciendo").length}</div><div class="l">haciéndose</div></a>
      <a href="javascript:void(0)" class="${attention.length ? "bad" : ""}" onclick="document.getElementById('h-warn')?.scrollIntoView({behavior:'smooth'})"><div class="n">${attention.length}</div><div class="l">fallan</div></a>
      <a href="#/subir"><div class="n">${all.filter((v) => v.status === "hecho" && !v.published).length}</div><div class="l">para subir${late ? ` · <span style="color:var(--bad)">${late} tarde</span>` : ""}</div></a></div>
    <form class="hero home-search" onsubmit="event.preventDefault();searchFrom(this.q.value)">
      <textarea name="q" placeholder="🔎 ¿Ya lo hice? Escribe un tema o un nombre (dingos, Kratochvílová, A380…) o pega un guion entero"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();searchFrom(this.value)}"></textarea>
      <button class="main">Buscar</button></form>
    <div class="kpis home-kpis">
      <a class="kpi" href="#/servidor"><div class="k">Servidor</div><div class="v" style="font-size:19px;margin:6px 0 2px">${state[0]}</div><div class="d">${state[1]}</div></a>
      <a class="kpi" href="#/subir"><div class="k">Para subir</div><div class="v">${all.filter((v) => v.status === "hecho" && !v.published).length}</div>
        <div class="d">${late ? `<span style="color:var(--bad)">${late} atrasado(s)</span>` : "al día"} →</div></a>
      <div class="kpi"><div class="k">En cola</div><div class="v">${all.filter((v) => v.status === "en cola").length + all.filter((v) => v.status === "haciendo").length}</div>
        <div class="d">${all.filter((v) => v.status === "haciendo").length} haciéndose ahora</div></div>
      <div class="kpi"><div class="k">Gasto de hoy</div><div class="v">${b.today.toFixed(2)} $</div>
        <div class="d">${b.limit ? "de " + b.limit.toFixed(2) + " $" : "sin límite"}</div>
        ${b.limit ? `<div class="bar"><i style="width:${Math.min(100, 100 * b.today / b.limit)}%;background:var(--accent)"></i></div>` : ""}</div>
    </div>
    ${channels.length > 1 ? `<div class="chiprow">${["", ...channels].map((c) => `<button class="${c === homeChannel ? "on" : ""}" onclick="pickChannel('${esc(c)}')">
      ${c ? `<span class="dot" style="background:${chColor(c)};margin-right:6px"></span>${esc(c)} <span class="muted">${all.filter((v) => v.channel === c).length}</span>` : "Todos"}</button>`).join("")}</div>` : ""}
    ${block("⚠️ Necesitan tu atención", attention, {cls: "warn", id: "h-warn", more: failed ? `<button onclick="retryAll()">Reintentar todos (${failed})</button><span id="retrymsg" class="muted"></span>` : "",
      right: (v) => v.status === "incompleto" ? '<span class="pill">falta guion o voz</span>'
        : v.status === "en pausa" ? `${pill(v.status)} <button onclick="event.preventDefault();event.stopPropagation();unholdHome('${esc(v.slug)}')">Volver a la cola</button>`
        : pill(v.status)})}
    ${block("▶ Haciéndose ahora", by("haciendo"), {cls: "now", id: "h-now"})}
    ${block("📤 Para subir", toUpload, {more: '<a href="#/subir">Abrir «Para subir» →</a>', right: when})}
    ${block("⏳ En cola", queue, {more: !s.watching && !s.queueRunning ? '<button class="main" onclick="startQueue()">Hacer la cola ahora</button>' : "",
      right: (v) => v.quotaWait ? `<span class="pill" title="${esc(v.quotaWait)}">⏸ ${v.quotaWait.startsWith("espera a YouTube") ? "espera YouTube" : "espera API " + esc((v.quotaWait.match(/hasta las (\d\d:\d\d)/) || [])[1] || "")}</span>`
        : v.lastError ? '<span class="pill error">reintento</span>' : `<span class="muted">${v.stagesDone ? v.stagesDone + "/15 pasos" : "por empezar"}</span>`})}
    ${block("✅ Subidos a YouTube", uploaded, {collapsible: true, open: false, limit: 30, more: '<a href="#/videos">Ver la lista entera →</a>',
      right: (v) => v.published && v.published.at ? `subido ${esc(String(v.published.at).slice(0, 10))}` : "en YouTube"})}
    ${vids.length ? "" : '<div class="notice">Aún no hay vídeos aquí. <a href="#/nuevo">Crea uno</a>.</div>'}`;
  schedule(home, by("haciendo").length ? 10000 : 30000);
}
window.pickChannel = (c) => { homeChannel = c; try { localStorage.setItem("inicio:canal", c); } catch (e) {} drawHome(); };
window.searchFrom = (q) => { q = String(q || "").trim(); if (!q) return;
  if (q.length > 1500) { window.pendingSearch = q; location.hash = "#/buscar/" + encodeURIComponent("(guion pegado)"); }
  else location.hash = "#/buscar/" + encodeURIComponent(q); };

function marked(text, words) {
  let out = esc(text);
  for (const w of words.filter((x) => x.length > 2).slice(0, 12)) {
    const plain = w.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp(`(${plain.split("").map((c) => c + "[\\u0300-\\u036f]?").join("")})`, "gi"), "<mark>$1</mark>");
  }
  return out;
}

async function searchPage(q) {
  const pasted = q === "(guion pegado)" && window.pendingSearch;
  const query = pasted ? window.pendingSearch : q;
  $("#app").innerHTML = `<h1>¿Ya lo hice?</h1><div class="muted">Buscando…</div>`;
  const r = await post("/api/search", {q: query});
  const words = query.split(/\s+/);
  $("#app").innerHTML = `<h1>¿Ya lo hice?</h1>
    <form class="hero" onsubmit="event.preventDefault();searchFrom(this.q.value)">
      <textarea name="q" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();searchFrom(this.value)}">${pasted ? "" : esc(q)}</textarea>
      <button class="main">Buscar</button></form>
    <div class="small muted" style="margin-bottom:8px">${r.whole ? "Has pegado un guion: comparo sus nombres, lugares y cifras con todos tus guiones." : `Busco «${esc(q)}» en títulos y guiones de todos los vídeos (también los archivados y subidos).`}</div>
    ${r.results.length ? `<div class="block">${r.results.map((v) => `<a class="vrow hit" href="#/video/${encodeURIComponent(v.slug)}">
        <span class="dot" style="background:${chColor(v.channel)}"></span>
        <div style="min-width:0"><div class="t">${esc(v.title || v.slug)}</div>
          <div class="s">${esc([v.title ? v.slug : "", v.channel, v.archived ? "archivado" : ""].filter(Boolean).join(" · "))}</div>
          ${v.snippet ? `<div class="small" style="margin-top:4px;white-space:normal">${r.whole ? esc(v.snippet) : marked(v.snippet, words)}</div>` : ""}</div>
        <div class="r">${r.whole ? `<b style="font-size:15px;color:${v.score >= 0.5 ? "var(--bad)" : "var(--accent)"}">${Math.round(v.score * 100)}% parecido</b><br>` : ""}
          ${v.published ? '<span class="pill hecho">en YouTube</span>' : pill(v.status)}</div></a>`).join("")}</div>`
      : `<div class="notice ok">✅ No hay ningún vídeo con eso. ${r.whole ? "Este guion es nuevo." : "No lo has hecho todavía."} <a href="#/nuevo">Crear vídeo →</a></div>`}
    ${(r.ideas || []).length ? `<h2>En tus ideas (sin hacer todavía)</h2><div class="block">${r.ideas.map((i) => `<a class="vrow hit" href="#/tablero">
        <span class="dot" style="background:${chColor(i.channel)}"></span>
        <div style="min-width:0"><div class="t">${marked(i.title, words)}</div>
          <div class="s">${esc([i.channel || "sin canal", i.where].join(" · "))}</div>
          ${i.note ? `<div class="small" style="margin-top:4px;white-space:normal">${marked(i.note, words)}</div>` : ""}</div>
        <div class="r"><span class="pill">💡 idea</span></div></a>`).join("")}</div>` : ""}`;
}


async function startQueue() { await post("/api/queue"); setTimeout(route, 1500); }
async function retryAll() {
  const r = await post("/api/queue/retry-all");
  const box = $("#retrymsg"); if (box) box.textContent = r.message;
  setTimeout(route, 4000);
}

async function newVideo() {
  data = data || await api("/api/overview");
  let pre = window.prefill;
  if (!pre) { try { pre = JSON.parse(sessionStorage.getItem("prefill") || "null"); } catch (e) {} }
  window.prefill = pre;
  const idea = pre && pre.idea;
  $("#app").innerHTML = `<h1>Nuevo vídeo</h1>
    ${idea ? `<div class="notice"><div class="row" style="justify-content:space-between"><b>Idea: ${esc(idea.title)}</b>
        <button onclick="window.prefill=null;try{sessionStorage.removeItem('prefill')}catch(e){};route()">Quitar idea</button></div>
      <div class="small">${esc(idea.angle || "")}</div>${idea.hook ? `<div class="small"><b>Gancho:</b> ${esc(idea.hook)}</div>` : ""}
      ${idea.outline && idea.outline.length ? `<ol class="small">${idea.outline.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
      ${idea.research ? `<div class="small muted"><b>Comprobar antes:</b> ${esc(idea.research)}</div>` : ""}
      <div class="small muted" style="margin-top:6px">Se guarda como idea.md junto al guion. Escribe el guion con este esquema y graba la voz.</div></div>` : ""}
    <div class="card">
      <div class="two">
        <div><label>Canal <a class="small" href="#/canal-nuevo" style="font-weight:400">+ nuevo canal</a></label><select id="channel">${channelOptions(data)}</select></div>
        <div><label>Nombre <span class="muted">(sin espacios: avion2, olga-korbut…)</span></label><input id="name" placeholder="nombre-del-video"></div>
      </div>
      <div class="two">

    </div>`;
  $("#scriptfile").onchange = (e) => { const f = e.target.files[0]; if (f) f.text().then((t) => $("#script").value = t); };
  if (pre && pre.script) $("#script").value = pre.script;
  if (idea) {
    if (pre.channel && data.channels.includes(pre.channel)) $("#channel").value = pre.channel;
    if (idea.format) $("#format").value = idea.format;
    $("#title").value = idea.title || "";
    $("#name").value = (idea.title || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  }
}

async function checkHook() {

    msg.textContent = "";

    $("#hookbox").innerHTML = `<div class="notice ${cls}"><b>${esc(r.verdict)}</b>
      <div class="small" style="margin-top:6px"><b>Lo que promete el título:</b> ${esc(r.promise)}</div>
      ${r.payoffSentence ? `<div class="small"><b>Se cumple por primera vez (≈${Math.round(r.payoffSeconds)} s):</b> «${esc(r.payoffSentence)}»</div>` : ""}
      ${r.strongestSentence ? `<div class="small"><b>Lo más fuerte del guion (≈${Math.round(r.strongestSeconds)} s):</b> «${esc(r.strongestSentence)}»</div>` : ""}
      ${r.problems.length ? `<ul class="small">${r.problems.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}
      ${r.newOpening ? `<div class="small" style="margin-top:8px"><b>Apertura propuesta (~15 s):</b></div><blockquote id="newopen" style="margin:6px 0;padding-left:10px;border-left:3px solid var(--accent)">${esc(r.newOpening)}</blockquote>
        <div class="row"><button onclick="useOpening()">Poner esta apertura al principio del guion</button><button onclick="navigator.clipboard.writeText(document.getElementById('newopen').innerText)">Copiar</button></div>` : ""}

async function checkScenes() {
  const msg = $("#scenemsg"); msg.textContent = "Mirando qué se puede enseñar… (~20 s)"; $("#scenebtn").disabled = true;
  try {
    const r = await post("/api/scenes", {script: $("#script").value, channel: $("#channel").value});

      ${r.flagged.length ? `<ul class="small">${r.flagged.map((f) => `<li><b>[${f.n}]</b> «${esc(f.line)}»<br>${esc(f.why)}<br><i>Propuesta:</i> ${esc(f.fix)}</li>`).join("")}</ul>` : ""}</div>`;

function useOpening() {
  const box = $("#script"), text = document.getElementById("newopen").innerText.trim();
  if (!box.value.startsWith(text)) box.value = text + "\n\n" + box.value;
  $("#hookmsg").textContent = "Añadida al principio: ajusta el resto del arranque para que no se repita y vuelve a revisar.";
}

async function createVideo() {
  const voice = $("#voice").files[0], msg = $("#msg");
  let auto = false;
  if (!voice) {
    msg.textContent = "Comprobando…";
    try { auto = !!(await api("/api/voices")).speaks[$("#channel").value]; } catch (e) {}   // gimnasia-br: gimnasia's voice
    if (!auto) { msg.textContent = "Falta el archivo de voz (o pon una voz a este canal en Ajustes → Voces por canal)"; return; }
  }
  // «¿ya lo hice?»: the same story twice is easy to miss with many channels. Warned on the page, a second click
  // creates it: confirm() is silenced by some browsers and apps, and then the button did nothing at all
  const said = $("#script").value;
  if (window.twinOk !== said) {
    msg.textContent = "Comprobando…";
    try {
      const twin = ((await post("/api/search", {q: said})).results || []).find((r) => r.score >= 0.5);
      if (twin) {
        window.twinOk = said;
        msg.textContent = `⚠️ Este guion se parece un ${Math.round(twin.score * 100)} % a «${twin.title || twin.slug}» (${twin.slug}, ` +
          `${twin.published ? "ya en YouTube" : twin.status}). Pulsa «Crear y poner en cola» otra vez para crearlo igualmente.`;
        return;
      }
    } catch (e) {}
  }
  $("#create").disabled = true; msg.textContent = "Creando…";
  try {
    const made = await post("/api/videos", {channel: $("#channel").value, name: $("#name").value.trim(), format: $("#format").value,
      serie: $("#serie").value, language: $("#language").value, title: $("#title").value, script: $("#script").value, idea: window.prefill ? window.prefill.idea : null});
    window.prefill = null; try { sessionStorage.removeItem("prefill"); } catch (e) {}
    if (auto) { location.hash = "#/video/" + encodeURIComponent(made.slug); return; }   // GenAIPro makes the voice
    msg.textContent = "Subiendo la voz…"; $("#upbar").classList.remove("hide");
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `/api/video/${encodeURIComponent(made.slug)}/voz`);
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("#upbar i").style.width = (100 * e.loaded / e.total) + "%"; };
      xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(JSON.parse(xhr.responseText || "{}").error || xhr.statusText));
      xhr.onerror = () => reject(new Error("Fallo de red al subir"));
      xhr.send(voice);
    });
    location.hash = "#/video/" + encodeURIComponent(made.slug);
  } catch (e) { msg.textContent = e.message; $("#create").disabled = false; }
}

// «En YouTube»: sorted, filtered and grouped in the page, without asking the server again
let statsRows = [], statsDir = -1, statsQuery = "", statsGroup = false;
const YT_COLS = [["views", "Visitas"], ["perDay", "Al día"], ["at48h", "48 h"], ["at7d", "7 días"], ["watchHours", "Horas (est.)"],
  ["vsChannel", "vs canal"], ["likesPer1k", "👍/1.000"], ["commentsPer1k", "💬/1.000"], ["ageDays", "Días"]];
function ytSort(key) { statsDir = statsSort === key ? -statsDir : (key === "title" || key === "channel" ? 1 : -1); statsSort = key; drawYtTable(); }
function drawYtTable(typing = false) {
  const box = $("#yttable");
  if (!box) return;
  const q = statsQuery.trim().toLowerCase();
  const val = (v, key) => key === "title" ? (v.youtube.title || v.title || "").toLowerCase() : key === "channel" ? v.channel.toLowerCase() : v.youtube[key];
  const rows = statsRows.filter((v) => (!statsChannel || v.channel === statsChannel)
      && (!q || `${v.youtube.title || ""} ${v.title} ${v.slug} ${v.channel}`.toLowerCase().includes(q)))
    .sort((a, b) => { const x = val(a, statsSort), y = val(b, statsSort);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y) : x - y) * statsDir; });
  const counts = {}; statsRows.forEach((v) => counts[v.channel] = (counts[v.channel] || 0) + 1);
  const maxViews = Math.max(1, ...rows.map((v) => v.youtube.views || 0));
  const arrow = (key) => statsSort === key ? (statsDir > 0 ? " ▴" : " ▾") : "";
  const vs = (r) => r == null ? "—" : `<span class="pill ${r >= 1.5 ? "hecho" : r < 0.7 ? "error" : ""}">${times(r)}</span>`;
  const row = (v) => { const y = v.youtube; return `<tr class="v">
    <td><div class="row" style="gap:10px;flex-wrap:nowrap">
      <a href="${esc(v.url)}" target="_blank" rel="noopener">${y.thumbnail ? `<img class="thumb" src="${esc(y.thumbnail)}" loading="lazy" alt="">` : '<div class="thumb"></div>'}</a>
      <div style="min-width:0"><a href="#/video/${encodeURIComponent(v.slug)}" style="font-weight:600">${esc(y.title || v.title)}</a>
        <div class="sub"><i class="dot" style="background:${chColor(v.channel)}"></i>${esc(v.channel)} · ${esc(v.slug)}${v.publishedDay ? " · " + esc(v.publishedDay) : ""}${y.minutes ? " · " + fmt(y.minutes) + " min" : ""}</div></div></div></td>
    <td data-k="Visitas" title="${fmt(y.views)} visitas"><b>${kfmt(y.views)}</b><div class="vbar" style="width:${Math.max(3, 100 * (y.views || 0) / maxViews)}%"></div></td>
    <td data-k="Al día">${kfmt(y.perDay)}</td><td data-k="48 h" class="wide">${y.at48h != null ? kfmt(y.at48h) : "—"}</td>
    <td data-k="7 días" class="wide">${y.at7d != null ? kfmt(y.at7d) : "—"}</td><td data-k="Horas">${kfmt(y.watchHours)}</td>
    <td data-k="vs canal">${vs(y.vsChannel)}</td><td data-k="👍/1.000">${fmt(y.likesPer1k)}</td>
    <td data-k="💬/1.000" class="wide">${fmt(y.commentsPer1k)}</td><td data-k="Días">${fmt(y.ageDays)}</td></tr>`; };
  let body = "";
  if (statsGroup) {
    const groups = {}; rows.forEach((v) => (groups[v.channel] = groups[v.channel] || []).push(v));
    const order = Object.keys(groups).sort((a, b) => groups[b].reduce((s, v) => s + v.youtube.views, 0) - groups[a].reduce((s, v) => s + v.youtube.views, 0));
    body = order.map((c) => { const g = groups[c], views = g.reduce((s, v) => s + (v.youtube.views || 0), 0), hours = g.reduce((s, v) => s + (v.youtube.watchHours || 0), 0);
      return `<tr class="group"><td colspan="10"><span class="row" style="gap:8px"><i class="dot" style="background:${chColor(c)};width:11px;height:11px"></i>${esc(c)}
        <span class="muted small" style="font-weight:400">${g.length} vídeo(s) · ${kfmt(views)} visitas · ${kfmt(hours)} h (est.)</span></span></td></tr>${g.map(row).join("")}`; }).join("");
  } else body = rows.map(row).join("");
  box.innerHTML = `<div class="yt-tools">
      <input type="search" placeholder="Buscar título o carpeta…" value="${esc(statsQuery)}" oninput="statsQuery=this.value;drawYtTable(true)">
      <button class="yt-chip ${statsChannel ? "" : "on"}" onclick="statsChannel='';drawYtTable()">Todos <span class="muted">${statsRows.length}</span></button>
      ${Object.keys(counts).sort().map((c) => `<button class="yt-chip ${c === statsChannel ? "on" : ""}" onclick="statsChannel='${esc(c)}';drawYtTable()">
        <i class="dot" style="background:${chColor(c)}"></i>${esc(c)} <span class="muted">${counts[c]}</span></button>`).join("")}
      <span class="row small" style="gap:4px;margin-left:auto;flex-wrap:nowrap">Ordenar:
        <select style="width:auto" onchange="statsSort=this.value;statsDir=['title','channel'].includes(this.value)?1:-1;drawYtTable()">
          ${[["channel", "Canal"], ["title", "Título"], ...YT_COLS].map(([k, label]) => `<option value="${k}" ${statsSort === k ? "selected" : ""}>${label}</option>`).join("")}</select>
        <button title="Al revés" onclick="statsDir=-statsDir;drawYtTable()">${statsDir > 0 ? "▴" : "▾"}</button></span>
      <label class="small" style="display:flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap">
        <input type="checkbox" ${statsGroup ? "checked" : ""} onchange="statsGroup=this.checked;drawYtTable()"> Agrupar por canal</label></div>
    <div class="card" style="overflow:auto;padding:0;max-height:75vh"><table class="ytt">
      <thead><tr><th class="${statsSort === "title" ? "on" : ""}" onclick="ytSort('title')">Vídeo${arrow("title")}
        <span style="margin-left:10px" class="${statsSort === "channel" ? "on" : ""}" onclick="event.stopPropagation();ytSort('channel')">· Canal${arrow("channel")}</span></th>
        ${YT_COLS.map(([k, label]) => `<th class="${statsSort === k ? "on" : ""} ${["at48h", "at7d", "commentsPer1k"].includes(k) ? "wide" : ""}" onclick="ytSort('${k}')">${label}${arrow(k)}</th>`).join("")}</tr></thead>
      <tbody>${body || '<tr><td colspan="10" class="muted" style="text-align:center;padding:20px">Ningún vídeo con ese filtro.</td></tr>'}</tbody>
    </table></div>
    <div class="small muted" style="margin-top:4px">${rows.length} de ${statsRows.length} vídeos · ${kfmt(rows.reduce((s, v) => s + (v.youtube.views || 0), 0))} visitas · ${kfmt(rows.reduce((s, v) => s + (v.youtube.watchHours || 0), 0))} h (est.) · toca una columna para ordenar (otra vez: al revés)</div>`;
  if (typing) { const input = box.querySelector("input[type=search]"); input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
}

async function restartQueue(button) {
  if (!confirm("¿Reiniciar la cola? El vídeo que se esté haciendo sigue luego desde su última etapa terminada.")) return;
  button.disabled = true;
  try { alert((await post("/api/restart-queue")).message); } catch (e) { alert(e.message); }
  button.disabled = false;
}
async function youtubeRetry(button) {
  if (!confirm("¿YouTube ya funciona? Ábrelo en una ventana privada desde el wifi de casa: si NO pide «no eres un bot», sigue.\n\nSe quitan la pausa por bloqueo, las cuarentenas y la espera de 72 h, y la cola vuelve a buscar ya.")) return;
  button.disabled = true;
  try { alert((await post("/api/youtube/retry")).message); } catch (e) { alert(e.message); }
  button.disabled = false;
}
async function copyForClaude(slug, button) {
  let text = "";
  try { text = (await post(`/api/video/${encodeURIComponent(slug)}/for-claude`)).text; }
  catch (e) { alert(e.message); return; }
  try { await navigator.clipboard.writeText(text); button.textContent = "Copiado ✓ pégalo en el chat"; return; }
  catch (e) {}                                     // Safari refuses the clipboard after waiting for the server
  const modal = document.createElement("div");
  modal.className = "modal"; modal.id = "modal";
  modal.innerHTML = `<div><div class="row" style="justify-content:space-between"><b>Para Claude</b>
    <button onclick="document.getElementById('modal').remove()">Cerrar</button></div>
    <div class="small muted" style="margin:6px 0">Mantén pulsado el texto → Seleccionar todo → Copiar, y pégalo en el chat.</div>
    <textarea readonly style="min-height:50vh">${esc(text)}</textarea></div>`;
  document.body.appendChild(modal);
  const box = modal.querySelector("textarea"); box.focus(); box.select();
}
async function updateNow(button) {
  button.disabled = true; button.textContent = "Actualizando…";
  try {
    const r = await post("/api/update");
    alert(r.message);
    setTimeout(() => location.reload(), r.changed ? 4000 : 300);    // «ya al día» too: the tab may be older
  } catch (e) { alert(e.message); }
  button.disabled = false; button.textContent = "🔄 Actualizar ahora";
}

function movePrio(i, step) {                       // ▲ ▼ ✕ in «Prioridad en la cola»
  const list = [...(window.prioList || [])];
  if (step === 0) list.splice(i, 1);
  else [list[i], list[i + step]] = [list[i + step], list[i]];
  save({channel_priority: list});
}

const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("es-ES", {maximumFractionDigits: 1});
const kfmt = (n) => n == null ? "—" : n >= 1e6 ? fmt(n / 1e6) + " M" : n >= 1e3 ? fmt(n / 1e3) + " mil" : fmt(n);
const times = (r) => r == null ? "—" : fmt(r) + "×";
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function jobLine(job, what) {
  if (!job) return "";
  if (job.running) return `<div class="notice">${what}… <span class="small muted">(se actualiza solo)</span><pre class="small">${esc(job.log.split("\n").slice(-6).join("\n"))}</pre></div>`;
  if (job.failed) return `<div class="notice bad">Falló: <pre class="small">${esc(job.log.split("\n").slice(-10).join("\n"))}</pre></div>`;
  return "";
}

    <div class="tabs">${[["todos", `Todos (${r.shots.length})`], ["pendientes", `Sin revisar (${left})`], ["incorrecta", `Incorrectos (${counts.incorrecta})`],

      `<button class="${k === reviewFilter ? "on" : ""}" onclick="reviewFilter='${k}';route()">${n}</button>`).join("")}</div>
    <div class="review">${shown.map((s) => {

let myChannel = null;
function heatColor(r) {
  if (r == null) return "#30363d";
  const scale = ["#e5534b", "#a8302c", "#5c1f1d", "#3a3f46", "#1c3a6e", "#1f5fbf", "#3b8bf0", "#a8cdfb"];
  const steps = [0.5, 0.7, 0.9, 1.1, 1.3, 1.6, 2.0];
  return scale[steps.filter((s) => r >= s).length];
}

  data = data && data.channels ? data : await api("/api/overview");

      <div class="row"><select onchange="myChannel=this.value;route()" style="width:auto">${data.channels.map((n) => `<option ${n === myChannel ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
      <button class="main" onclick="analyse()" ${c.job.running || !c.handle ? "disabled" : ""}>Analizar ahora</button></div></div>
    ${c.handle ? `<div class="small muted">${esc(c.handle)}${r ? " · análisis del " + new Date(r.generated).toLocaleString("es-ES") : ""}</div>`
      : '<div class="notice">Falta tu canal de este perfil: ponlo en <a href="#/ajustes">Ajustes → Mi canal</a>.</div>'}
    ${jobLine(c.job, "Analizando el canal")}`;

  if (c.job.running) schedule(route, 6000);

  const diverge = (f) => { const w = Math.min(50, Math.abs(Math.log2(f)) * 60);

  $("#app").innerHTML = head + `

// --- Calendario: días de publicación por canal y qué vídeo sale en cada uno --------------------------------------
const DAY = (iso) => { const d = new Date(iso + "T12:00:00"); return d.toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "short"}); };
async function calendarPage() {
  const a = await api("/api/agenda"), st = a.settings, today = new Date().toISOString().slice(0, 10);
  const byDay = {};
  a.plan.forEach((s) => (byDay[s.date] = byDay[s.date] || []).push(s));
  const free = (channel) => a.videos.filter((v) => v.channel === channel && !["subido"].includes(v.status));
  const slot = (s) => {
    const v = s.video, cls = s.ok ? "ok" : s.gap ? "gap" : "";
    const state = !v ? `<span class="pill error">hueco</span> <span class="small muted">${s.past ? "" : (s.late ? "⏰ ya vas tarde" : "guion y voz antes del " + DAY(s.deadline.slice(0, 10)) + " " + s.deadline.slice(11))}</span>`
      : `<a href="#/video/${encodeURIComponent(v.slug)}">${esc(v.title || v.slug)}</a> ${pill(v.status === "subido" ? "hecho" : v.status)} ${v.status === "subido" ? '<span class="small muted">subido</span>' : ""}
         ${s.pinned ? '<span class="small muted">📌 fijado</span>' : ""}
         ${s.gap && !s.past ? `<span class="small muted">${s.late ? "⏰ ya vas tarde" : "listo antes del " + DAY(s.deadline.slice(0, 10)) + " " + s.deadline.slice(11)}</span>` : ""}`;
    const choose = s.past ? "" : `<select onchange="pin(this.value, '${s.date}')"><option value="">Poner otro…</option>${free(s.channel).map((x) =>
      `<option value="${esc(x.slug)}">${esc(x.slug)} (${esc(x.status)})</option>`).join("")}</select>`;
    const done = v && v.status === "hecho" && s.date <= today ? `<button onclick="uploaded('${esc(v.slug)}')">Ya está subido</button>` : "";
    const unpin = s.pinned ? `<button onclick="pin('${esc(v.slug)}', '')">Quitar fijado</button>` : "";
    return `<div class="slot ${cls} ${s.past ? "past" : ""}"><b>${esc(s.channel)} · ${esc(s.time)}</b><span>${state}</span>
      <span style="margin-left:auto" class="row">${done}${unpin}${choose}</span></div>`;
  };
  const reserve = Object.entries(a.reserve).map(([c, n]) => `<span class="pill ${n < st.buffer ? "error" : "hecho"}">${esc(c)}: ${n} listo${n === 1 ? "" : "s"}</span>`).join(" ");
  const rules = Object.entries(st.schedule).map(([c, r]) => `<div class="card" style="margin-bottom:10px">
      <div class="row" style="justify-content:space-between"><b>${esc(c)}</b>
        <label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" ${r.enabled ? "checked" : ""} onchange="rule('${esc(c)}', {enabled: this.checked})"> publica en este canal</label></div>
      <div class="days" style="margin-top:8px">${a.weekdays.map((d, i) => `<label><input type="checkbox" ${r.days.includes(i) ? "checked" : ""}
        onchange="toggleDay('${esc(c)}', ${i}, this.checked)"> ${d.slice(0, 3)}</label>`).join("")}
        <input type="time" value="${esc(r.time)}" style="width:auto;margin-left:8px" onchange="rule('${esc(c)}', {time: this.value})"></div></div>`).join("");
  window.agendaRules = st.schedule;
  $("#app").innerHTML = `<h1>Calendario</h1>
    <div class="row">${reserve} <span class="small muted">vídeos listos sin subir por canal (objetivo ${st.buffer})</span></div>
    ${Object.keys(byDay).sort().map((d) => `<div class="cal-day ${d === today ? "today" : ""}">${DAY(d)}${d === today ? " · hoy" : ""}</div>${byDay[d].map(slot).join("")}`).join("")
      || '<div class="notice">No hay días de publicación: márcalos abajo.</div>'}
    <h2>Días de publicación</h2>${rules}
    <div class="card"><div class="two">
      <div><label>Margen para tener guion y voz <span class="muted">(horas antes de publicar)</span></label>
        <input type="number" min="6" step="1" value="${st.lead_hours}" onchange="option({lead_hours: +this.value})"></div>
      <div><label>Vídeos de reserva por canal <span class="muted">(aviso si hay menos)</span></label>
        <input type="number" min="0" step="1" value="${st.buffer}" onchange="option({buffer: +this.value})"></div>
      <div><label>Hora del resumen de la mañana <span class="muted">(Telegram)</span></label>
        <input type="number" min="0" max="23" value="${st.morning_hour}" onchange="option({morning_hour: +this.value})"></div></div></div>`;
  window.pin = async (slug, date) => { if (!slug) return; await post("/api/agenda", {assign: slug, date}); calendarPage(); };
  window.uploaded = async (slug) => { const url = prompt("Enlace del vídeo en YouTube (para seguir sus vistas; opcional):", ""); if (url === null) return;
    await post(`/api/video/${encodeURIComponent(slug)}/published`, {value: true, url}); calendarPage(); };
  window.rule = async (channel, change) => { await post("/api/agenda", {channel, ...change}); calendarPage(); };
  window.toggleDay = (channel, day, on) => { const days = new Set(window.agendaRules[channel].days); on ? days.add(day) : days.delete(day); rule(channel, {days: [...days]}); };
  window.option = async (change) => { await post("/api/agenda", change); calendarPage(); };
}

// --- Para subir: lo hecho y no subido, con todo lo que pide YouTube Studio (pipeline/organizar.py) ----------------
const copyTexts = [];
function copyBox(label, text, rows = 3) {
  const n = copyTexts.push(text) - 1;
  if (!label) return `<div class="row" style="margin:6px 0;gap:6px"><input readonly value="${esc(text)}" style="flex:1"><button onclick="copyIt(${n}, this)">Copiar</button></div>`;
  return `<div style="margin:10px 0"><div class="row" style="justify-content:space-between"><b class="small">${esc(label)}</b>
    <button onclick="copyIt(${n}, this)">Copiar</button></div>
    <textarea readonly rows="${rows}" style="min-height:0">${esc(text)}</textarea></div>`;
}
window.copyIt = async (n, button) => {
  try { await navigator.clipboard.writeText(copyTexts[n]); button.textContent = "Copiado ✓"; setTimeout(() => button.textContent = "Copiar", 1500); }
  catch (e) { button.textContent = "Selecciona y copia"; }
};
function checked(slug, step) { try { return localStorage.getItem(`subir:${slug}:${step}`) === "1"; } catch (e) { return false; } }
window.check = (slug, step, on) => { try { localStorage.setItem(`subir:${slug}:${step}`, on ? "1" : "0"); } catch (e) {} };
const UPLOAD_STEPS = [["video", "Vídeo subido"], ["title", "Título"], ["description", "Descripción"], ["thumb", "Miniatura"],
  ["subs", "Subtítulos"], ["tags", "Etiquetas"], ["schedule", "Programado a su hora"], ["comment", "Comentario fijado"],
  ["community", "Post de comunidad"], ["shorts", "Shorts"]];
let uploadChannel = (() => { try { return localStorage.getItem("subir:canal") || ""; } catch (e) { return ""; } })();
window.pickUploadChannel = (c) => { uploadChannel = c; try { localStorage.setItem("subir:canal", c); } catch (e) {} uploadPage(); };
async function uploadPage() {
  const r = await api("/api/upload");
  copyTexts.length = 0;
  const today = new Date().toISOString().slice(0, 10);
  $("#app").innerHTML = `<h1>Para subir</h1>
    <div class="small muted" style="margin-bottom:12px">Vídeos terminados que aún no están en YouTube, por el día que les toca en el calendario.
      Copia cada parte en YouTube Studio, marca los pasos y al final pulsa «Ya está subido».</div>
    ${r.videos.length ? "" : '<div class="notice ok">No hay nada pendiente de subir. 🎉 Mira <a href="#/guiones">Guiones</a> para preparar los siguientes.</div>'}
    ${r.compilations && r.compilations.length ? `<div class="card"><b>📼 Compilaciones largas</b>
      <div class="small muted">Junta los mejores vídeos terminados de un canal en uno de 2-3 horas («3 HORAS de…»): mucho tiempo de visualización con trabajo ya hecho. Tarda ~30-60 min.</div>
      ${jobLine(r.compilationJob, "Montando la compilación")}
      <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">${r.compilations.map((c) =>
        `<button onclick="makeCompilation('${esc(c.channel)}', this)" ${r.compilationJob.running || c.videos < 3 ? "disabled" : ""} title="${esc(c.titles.join(" · "))}">📼 ${esc(c.channel)} (${c.videos} vídeos)</button>`).join("")}</div></div>` : ""}
    ${(() => { const chans = [...new Set(r.videos.map((v) => v.channel))].sort();
      return chans.length > 1 ? `<div class="chiprow">${["", ...chans].map((c) => `<button class="${c === uploadChannel ? "on" : ""}" onclick="pickUploadChannel('${esc(c)}')">
        ${c ? `<span class="dot" style="background:${chColor(c)};margin-right:6px"></span>${esc(c)} <span class="muted">${r.videos.filter((v) => v.channel === c).length}</span>` : "Todos"}</button>`).join("")}</div>` : ""; })()}
    ${r.videos.filter((v) => !uploadChannel || v.channel === uploadChannel).map((v, i, list) => {
      const s = v.sections || {}, f = (p) => `/files/${encodeURIComponent(v.slug)}/${p.split("/").map(encodeURIComponent).join("/")}`;

        <div style="min-width:0"><b style="font-size:1.05em">${esc(v.title || v.slug)}</b>

          <div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap">${v.files.filter((x) => x.still).map((x) =>

        ${s["IDEAS PARA LA MINIATURA"] ? copyBox("Ideas de texto para la miniatura", s["IDEAS PARA LA MINIATURA"], 3) : ""}

        <div class="row" style="margin-top:12px"><button class="main" onclick="doneUpload('${esc(v.slug)}')">Ya está subido</button></div>
