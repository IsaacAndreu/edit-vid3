<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de vídeos</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1f2630; --line: #2b3440; --text: #e6edf3; --muted: #8b98a8;
    --accent: #f5b301; --ok: #3fb950; --bad: #f85149; --work: #58a6ff; --wait: #a371f7;
    --radius: 12px; --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f6f7f9; --panel: #ffffff; --panel2: #f0f2f5; --line: #dfe3e8; --text: #1b1f24; --muted: #5b6570; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
  a { color: var(--work); text-decoration: none; }
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
           display: flex; gap: 18px; align-items: center; padding: 10px 20px; flex-wrap: wrap; }
  header b { font-size: 17px; margin-right: 8px; }
  header nav { display: flex; gap: 4px; flex-wrap: wrap; }
  header nav a { color: var(--muted); padding: 6px 12px; border-radius: 8px; }
  header nav a.on, header nav a:hover { color: var(--text); background: var(--panel2); }
  main { max-width: 1180px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 16px; } h2 { font-size: 17px; margin: 26px 0 10px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .card.click { cursor: pointer; } .card.click:hover { border-color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
          background: var(--panel2); color: var(--muted); }
  .pill.hecho { color: var(--ok); } .pill.error { color: var(--bad); } .pill.haciendo { color: var(--work); }
  .pill["en cola"], .pill.cola { color: var(--wait); }
  .stat { font-size: 26px; font-weight: 700; }
  .bar { height: 8px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--work); border-radius: 99px; transition: width .4s; }
  button, .btn { font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
                 padding: 8px 14px; border-radius: 9px; cursor: pointer; display: inline-block; }
  button.main, .btn.main { background: var(--accent); color: #1b1300; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
                            border-radius: 9px; padding: 9px 11px; width: 100%; }
  textarea { min-height: 260px; resize: vertical; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; } label .muted { font-weight: 400; }
  .two { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; } @media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
  table { border-collapse: collapse; width: 100%; font-size: 14px; } td, th { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: left; }
  pre { background: var(--panel2); border-radius: 9px; padding: 12px; overflow: auto; max-height: 420px; font-size: 12.5px; white-space: pre-wrap; }
  video { width: 100%; border-radius: var(--radius); background: #000; max-height: 70vh; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 10px; }
  .tabs button.on { background: var(--text); color: var(--bg); }
  .md h1 { font-size: 19px; } .md h2 { font-size: 16px; } .md table { margin: 8px 0; } .md img { max-width: 100%; border-radius: 8px; }
  .thumbs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } .thumbs img { width: 100%; border-radius: 8px; }
  .notice { padding: 12px 14px; border-radius: 10px; background: var(--panel2); border-left: 4px solid var(--accent); margin: 12px 0; }
  .notice.bad { border-color: var(--bad); } .notice.ok { border-color: var(--ok); }
  .spend { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
  .spend div { flex: 1; background: var(--accent); border-radius: 6px 6px 0 0; min-height: 2px; position: relative; }
  .spend span { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
  #login { max-width: 360px; margin: 12vh auto; }
  .review { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .review .card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .review .card.correcta { border-color: var(--ok); } .review .card.incorrecta { border-color: var(--bad); } .review .card.dudosa { border-color: #d29922; }
  .review img { width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #000; display: block; }
  .review .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .review .quote { font-size: 14px; } .review .src { font-size: 12px; color: var(--muted); }
  .review .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .review .acts button { padding: 5px 10px; font-size: 13px; } .review select { width: auto; padding: 5px 8px; font-size: 13px; }
  .b-ok { background: #238636 !important; color: #fff !important; border-color: #238636 !important; }
  .b-bad { background: #da3633 !important; color: #fff !important; border-color: #da3633 !important; }
  .b-doubt { background: #9e6a03 !important; color: #fff !important; border-color: #9e6a03 !important; }
  .acts button.off { opacity: .45; }
  .vids { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .vids .card { padding: 0; overflow: hidden; } .vids img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .vids .body { padding: 10px 12px; } .big { font-size: 20px; font-weight: 800; color: var(--accent); }
  .chips { position: sticky; top: 54px; z-index: 4; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; }
  .chips a { white-space: nowrap; padding: 6px 14px; border-radius: 99px; background: var(--panel2); color: var(--text); font-size: 14px; }
  .kicker { color: var(--ok); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-top: 34px; }
  .heat { display: grid; grid-template-columns: 44px repeat(8, 1fr); gap: 5px; font-size: 12px; }
  .heat div { text-align: center; } .heat .c { aspect-ratio: 1.3; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; } .heat .c.few { outline: 1.5px dashed rgba(255,255,255,.45); outline-offset: -2px; } .heat .c.none { background: transparent; outline: 1px dashed var(--line); }
  .legend { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .legend i { width: 26px; height: 10px; border-radius: 4px; display: inline-block; }
  .months { display: flex; align-items: flex-end; gap: 6px; height: 170px; padding-top: 18px; }
  .months > div { flex: 1; display: flex; flex-direction: column-reverse; position: relative; height: 100%; }
  .months b { position: absolute; top: -18px; width: 100%; text-align: center; font-size: 12px; }
  .months .l { background: #3b82f6; border-radius: 4px 4px 0 0; } .months .s { background: #ea580c; border-radius: 4px 4px 0 0; }
  .months span { position: absolute; bottom: -20px; width: 100%; text-align: center; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .trait { padding: 10px 0; border-bottom: 1px solid var(--line); } .trait .row { justify-content: space-between; }
  .diverge { position: relative; height: 10px; background: var(--panel2); border-radius: 99px; margin-top: 6px; }
  .diverge::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--muted); }
  .diverge i { position: absolute; top: 0; bottom: 0; border-radius: 99px; }
  .topic { display: grid; grid-template-columns: 28px 120px 1fr; gap: 12px; align-items: center; padding: 10px 0; }
  .topic img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; }
  .hbar { height: 10px; background: var(--panel2); border-radius: 99px; overflow: hidden; margin: 6px 0; } .hbar i { display: block; height: 100%; border-radius: 99px; }
  .modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 4vh 12px; }
  .modal > div { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: min(860px, 100%); padding: 18px 18px 24px; }
  .idea { margin-top: 14px; } .idea h3 { margin: 0 0 6px; font-size: 17px; } .idea ol { margin: 6px 0; padding-left: 22px; }
  .idea p { margin: 6px 0; }
  .elf { background: #12301f; color: #d6f5e0; border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  @media (prefers-color-scheme: light) { .elf { background: #e5f6ea; color: #13361f; } }
  .hide { display: none !important; }
</style>
</head>
<body>
<header id="top" class="hide">
  <b>🎬 Estudio</b>
  <nav>
    <a href="#/">Inicio</a><a href="#/nuevo">Nuevo vídeo</a><a href="#/errores">Errores</a><a href="#/competencia">Competencia</a><a href="#/canal">Mi canal</a><a href="#/estadisticas">Estadísticas</a><a href="#/ajustes">Ajustes</a>
  </nav>
  <span id="service" class="small muted"></span>
</header>
<main id="app"></main>

<div id="login" class="card hide">
  <h1>Estudio de vídeos</h1>
  <label>Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:14px"><button class="main" onclick="login()">Entrar</button><span id="loginmsg" class="muted small"></span></div>
</div>

<script>
const STAGES = {factcheck: "Verificar datos", align: "Alinear la voz", planner: "Planificar planos", sourcing: "Buscar material",
  analysis: "Analizar clips", judge: "Elegir (juez)", ingest: "Descargar en HD", people: "Personas", fallback: "Rellenar huecos",
  coldopen: "Apertura", timeline: "Montaje", qa: "Revisión", render: "Render", shorts: "Shorts", package: "Títulos y miniaturas"};
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
let timer = null, data = null;

async function api(path, options = {}) {
  const res = await fetch(path, {credentials: "same-origin", ...options});
  if (res.status === 401) { showLogin(); throw new Error("login"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})});

function showLogin() { $("#login").classList.remove("hide"); $("#top").classList.add("hide"); $("#app").innerHTML = ""; $("#pw").focus(); }
async function login() {
  try { await post("/api/login", {password: $("#pw").value}); $("#login").classList.add("hide"); start(); }
  catch (e) { $("#loginmsg").textContent = e.message; }
}
$("#pw").addEventListener("keydown", (e) => e.key === "Enter" && login());

function ago(iso) {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;
}
function mins(s) { return s == null ? "—" : s >= 60 ? `${(s / 60).toFixed(1)} min` : `${Math.round(s)} s`; }

// minimal markdown: headings, lists, tables, bold/italic, code, links, images (relative to the video's files)
function md(text, base) {
  if (!text) return '<p class="muted">Todavía no hay.</p>';
  const lines = esc(text).split("\n"); let html = "", inList = false, table = [], code = false;
  const inline = (t) => t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, a, src) => `<img alt="${a}" src="${/^https?:/.test(src) ? src : base + src.replace(/^\.?\//, "")}">`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\s)_([^_]+)_/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const flush = () => { if (inList) { html += "</ul>"; inList = false; }
    if (table.length) { html += "<table>" + table.filter((r) => !/^\|?\s*-{2,}/.test(r)).map((r, i) => "<tr>" + r.replace(/^\||\|$/g, "").split("|")
      .map((c) => i ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join("") + "</tr>").join("") + "</table>"; table = []; } };
  for (const line of lines) {
    if (line.startsWith("```")) { flush(); html += code ? "</pre>" : "<pre>"; code = !code; continue; }
    if (code) { html += line + "\n"; continue; }
    if (/^\s*\|/.test(line)) { table.push(line.trim()); continue; }
    if (/^\s*[-*] /.test(line)) { if (table.length) flush(); if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`; continue; }
    flush();
    const h = line.match(/^(#{1,4}) (.*)/);
    if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  flush(); return html;
}

function pill(status) { return `<span class="pill ${status === "en cola" ? "cola" : status}">${esc(status)}</span>`; }

function videoCard(v) {
  const st = v.stage;
  const progress = st ? `<div class="small" style="margin-top:8px">${st.number}/${st.of} · ${esc(STAGES[st.stage] || st.stage)} · ${ago(st.started)}</div>
     <div class="bar"><i style="width:${Math.round(100 * (st.number - 1) / st.of)}%"></i></div>` : "";
  return `<div class="card click" onclick="location.hash='#/video/${encodeURIComponent(v.slug)}'">
    <div class="row" style="justify-content:space-between"><b>${esc(v.slug)}</b><span>${v.published ? '<span class="pill hecho">en YouTube</span> ' : ""}${pill(v.status)}</span></div>
    <div class="small muted">${esc(v.channel || "—")}${v.minutes ? " · " + v.minutes + " min" : ""}${v.costUsd ? " · " + v.costUsd + " $" : ""}</div>
    ${progress}${v.error ? `<div class="small" style="color:var(--bad);margin-top:6px">${esc(String(v.error).slice(0, 140))}</div>` : ""}
    ${v.lastError ? `<div class="small muted" style="margin-top:6px">↻ ${v.retryAt ? "reintento a las " + esc(v.retryAt) : "se reintenta en su turno"} · falló la última vez</div>` : ""}</div>`;
}

async function home() {
  data = await api("/api/overview");
  const s = data.service, b = data.budget, vids = data.videos.filter((v) => !v.archived);
  const groups = {haciendo: [], "en cola": [], error: [], hecho: [], incompleto: []};
  vids.forEach((v) => (groups[v.status] || groups.incompleto).push(v));
  const state = s.paused ? '<span class="pill">En pausa</span>' : s.watching ? '<span class="pill hecho">Vigilando: hace los vídeos solo</span>'
    : s.queueRunning ? '<span class="pill haciendo">Cola en marcha</span>' : '<span class="pill">Sin vigilante</span>';
  const startBtn = !s.watching && !s.queueRunning && groups["en cola"].length ? '<button class="main" onclick="startQueue()">Hacer la cola ahora</button>' : "";
  $("#app").innerHTML = `
    <div class="grid">
      <div class="card"><div class="muted small">Servidor</div><div style="margin:8px 0">${state}</div>${startBtn}</div>
      <div class="card"><div class="muted small">Gasto de hoy</div><div class="stat">${b.today.toFixed(2)} $</div>
        <div class="small muted">${b.limit ? "límite " + b.limit.toFixed(2) + " $" : "sin límite"}</div>
        ${b.limit ? `<div class="bar"><i style="width:${Math.min(100, 100 * b.today / b.limit)}%;background:var(--accent)"></i></div>` : ""}</div>
      <div class="card"><div class="muted small">Vídeos</div><div class="stat">${groups.hecho.length} hechos</div>
        <div class="small muted">${groups["en cola"].length} en cola · ${groups.haciendo.length} en marcha · ${groups.error.length} con error</div></div>
      <div class="card"><div class="muted small">YouTube (7 días)</div>${data.youtube ? `<div class="stat">${data.youtube.ok}/${data.youtube.requests}</div>
        <div class="small muted">${data.youtube.failed} fallidas · ${data.youtube.mbps} MB/s</div>` : '<div class="muted" style="margin-top:8px">Sin datos aún</div>'}</div>
    </div>
    ${section("En marcha", groups.haciendo)}${section("Con error", groups.error)}${section("En cola", groups["en cola"])}
    ${section("Sin terminar de subir (falta guion o voz)", groups.incompleto)}${section("Hechos", groups.hecho)}
    ${vids.length ? "" : '<div class="notice">Aún no hay vídeos. <a href="#/nuevo">Crea el primero</a>.</div>'}`;
  schedule(home, groups.haciendo.length ? 10000 : 30000);
}
const section = (title, list) => list.length ? `<h2>${title}</h2><div class="grid">${list.map(videoCard).join("")}</div>` : "";

async function startQueue() { await post("/api/queue"); setTimeout(route, 1500); }

async function newVideo() {
  data = data || await api("/api/overview");
  let pre = window.prefill;
  if (!pre) { try { pre = JSON.parse(sessionStorage.getItem("prefill") || "null"); } catch (e) {} }
  window.prefill = pre;
  const idea = pre && pre.idea;
  $("#app").innerHTML = `<h1>Nuevo vídeo</h1>
    ${idea ? `<div class="notice"><div class="row" style="justify-content:space-between"><b>Idea: ${esc(idea.title)}</b>
        <button onclick="window.prefill=null;try{sessionStorage.removeItem('prefill')}catch(e){};route()">Quitar idea</button></div>
      <div class="small">${esc(idea.angle || "")}</div>${idea.hook ? `<div class="small"><b>Gancho:</b> ${esc(idea.hook)}</div>` : ""}
      ${idea.outline && idea.outline.length ? `<ol class="small">${idea.outline.map((x) => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
      ${idea.research ? `<div class="small muted"><b>Comprobar antes:</b> ${esc(idea.research)}</div>` : ""}
      <div class="small muted" style="margin-top:6px">Se guarda como idea.md junto al guion. Escribe el guion con este esquema y graba la voz.</div></div>` : ""}
    <div class="card">
      <div class="two">
        <div><label>Canal <a class="small" href="#/canal-nuevo" style="font-weight:400">+ nuevo canal</a></label><select id="channel">${data.channels.map((c) => `<option>${esc(c)}</option>`).join("")}</select></div>
        <div><label>Nombre <span class="muted">(sin espacios: avion2, olga-korbut…)</span></label><input id="name" placeholder="nombre-del-video"></div>
      </div>
      <div class="two">
        <div><label>Formato <span class="muted">(opcional; si no, el del canal)</span></label><select id="format"><option value="">— el del canal —</option>
          ${data.formats.map((f) => `<option>${esc(f)}</option>`).join("")}</select></div>
        <div><label>Serie <span class="muted">(opcional)</span></label><input id="serie" placeholder="p. ej. fracasos"></div>
      </div>
      <label>Título de trabajo <span class="muted">(opcional: los títulos de YouTube se escriben solos)</span></label><input id="title">
      <label>Guion <span class="muted">— pégalo o</span> <input type="file" id="scriptfile" accept=".txt,.md" style="width:auto;display:inline;padding:4px"></label>
      <textarea id="script" placeholder="## Capítulo 1&#10;Texto del guion…"></textarea>
      <label>Voz <span class="muted">(mp3; también wav o m4a)</span></label><input type="file" id="voice" accept="audio/*,.mp3,.wav,.m4a">
      <div class="row" style="margin-top:18px"><button id="hookbtn" onclick="checkHook()">Revisar el gancho (antes de grabar)</button><span id="hookmsg" class="small muted"></span></div>
      <div id="hookbox"></div>
      <div class="row" style="margin-top:18px"><button class="main" id="create" onclick="createVideo()">Crear y poner en cola</button><span id="msg" class="small muted"></span></div>
      <div class="bar hide" id="upbar"><i style="width:0"></i></div>
    </div>`;
  $("#scriptfile").onchange = (e) => { const f = e.target.files[0]; if (f) f.text().then((t) => $("#script").value = t); };
  if (idea) {
    if (pre.channel && data.channels.includes(pre.channel)) $("#channel").value = pre.channel;
    if (idea.format) $("#format").value = idea.format;
    $("#title").value = idea.title || "";
    $("#name").value = (idea.title || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
  }
}

async function checkHook() {
  const msg = $("#hookmsg"); msg.textContent = "Leyendo el arranque… (~15 s)"; $("#hookbtn").disabled = true;
  try {
    const r = await post("/api/hook", {title: $("#title").value, script: $("#script").value, channel: $("#channel").value});
    msg.textContent = "";
    const cls = r.ok ? "ok" : r.verdict.startsWith("❌") ? "bad" : "";
    $("#hookbox").innerHTML = `<div class="notice ${cls}"><b>${esc(r.verdict)}</b>
      <div class="small" style="margin-top:6px"><b>Lo que promete el título:</b> ${esc(r.promise)}</div>
      ${r.payoffSentence ? `<div class="small"><b>Se cumple por primera vez (≈${Math.round(r.payoffSeconds)} s):</b> «${esc(r.payoffSentence)}»</div>` : ""}
      ${r.strongestSentence ? `<div class="small"><b>Lo más fuerte del guion (≈${Math.round(r.strongestSeconds)} s):</b> «${esc(r.strongestSentence)}»</div>` : ""}

function useOpening() {

async function createVideo() {
  const voice = $("#voice").files[0], msg = $("#msg");
  if (!voice) { msg.textContent = "Falta el archivo de voz"; return; }
  $("#create").disabled = true; msg.textContent = "Creando…";
  try {
    const made = await post("/api/videos", {channel: $("#channel").value, name: $("#name").value.trim(), format: $("#format").value,
      serie: $("#serie").value, title: $("#title").value, script: $("#script").value, idea: window.prefill ? window.prefill.idea : null});
    window.prefill = null; try { sessionStorage.removeItem("prefill"); } catch (e) {}
    msg.textContent = "Subiendo la voz…"; $("#upbar").classList.remove("hide");
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `/api/video/${encodeURIComponent(made.slug)}/voz`);
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) $("#upbar i").style.width = (100 * e.loaded / e.total) + "%"; };
      xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error(JSON.parse(xhr.responseText || "{}").error || xhr.statusText));
      xhr.onerror = () => reject(new Error("Fallo de red al subir"));
      xhr.send(voice);
    });
    location.hash = "#/video/" + encodeURIComponent(made.slug);
  } catch (e) { msg.textContent = e.message; $("#create").disabled = false; }
}

const fmt = (n) => n == null ? "—" : Number(n).toLocaleString("es-ES", {maximumFractionDigits: 1});
const kfmt = (n) => n == null ? "—" : n >= 1e6 ? fmt(n / 1e6) + " M" : n >= 1e3 ? fmt(n / 1e3) + " mil" : fmt(n);
const times = (r) => r == null ? "—" : fmt(r) + "×";
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function jobLine(job, what) {
  if (!job) return "";
  if (job.running) return `<div class="notice">${what}… <span class="small muted">(se actualiza solo)</span><pre class="small">${esc(job.log.split("\n").slice(-6).join("\n"))}</pre></div>`;
  if (job.failed) return `<div class="notice bad">Falló: <pre class="small">${esc(job.log.split("\n").slice(-10).join("\n"))}</pre></div>`;
  return "";
}

let reviewFilter = "todos";
async function reviewPage(slug) {
  const r = await api("/api/review/" + encodeURIComponent(slug));
  const counts = {correcta: 0, incorrecta: 0, dudosa: 0};
  r.shots.forEach((s) => s.label && counts[s.label.verdict]++);
  const left = r.shots.length - counts.correcta - counts.incorrecta - counts.dudosa;
  const shown = r.shots.filter((s) => reviewFilter === "todos" || (reviewFilter === "pendientes" ? !s.label : s.label && s.label.verdict === reviewFilter));
  const options = Object.entries(r.reasons).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join("");
  $("#app").innerHTML = `
    <div class="row" style="justify-content:space-between"><h1>Revisar clips · <a href="#/video/${encodeURIComponent(slug)}">${esc(slug)}</a></h1>
      ${counts.incorrecta ? `<button class="main" onclick="fixVideo()" ${r.job.running ? "disabled" : ""}>Rehacer con correcciones (${counts.incorrecta})</button>` : ""}</div>
    <div class="small muted">Marca cada clip. Lo incorrecto no se vuelve a usar en ningún vídeo; «Rehacer con correcciones» cambia esos planos y vuelve a montar el vídeo.</div>
    ${jobLine(r.job, "Rehaciendo el vídeo con tus correcciones")}
    <div class="tabs">${[["todos", `Todos (${r.shots.length})`], ["pendientes", `Sin revisar (${left})`], ["incorrecta", `Incorrectos (${counts.incorrecta})`],
      ["dudosa", `Dudosos (${counts.dudosa})`], ["correcta", `Correctos (${counts.correcta})`]].map(([k, n]) =>
      `<button class="${k === reviewFilter ? "on" : ""}" onclick="reviewFilter='${k}';route()">${n}</button>`).join("")}</div>
    <div class="review">${shown.map((s) => {
      const v = s.label && s.label.verdict;
      return `<div class="card ${v || ""}" id="r-${s.id}">
        <img loading="lazy" src="/api/review/${encodeURIComponent(slug)}/frame/${s.id}.jpg" alt="">
        <div class="body">
          <div class="quote">«${esc(s.text || "—")}»</div>
          <div class="src">${clock(s.at)} · ${esc(s.title || s.credit || s.source || "")}${s.url ? ` · <a href="${esc(s.url)}" target="_blank" rel="noopener">fuente</a>` : ""}</div>
          <div class="acts">
            <button class="b-ok ${v && v !== "correcta" ? "off" : ""}" onclick="mark('${s.id}','correcta')">Correcta</button>
            <select id="why-${s.id}">${options}</select>
            <button class="b-bad ${v && v !== "incorrecta" ? "off" : ""}" onclick="mark('${s.id}','incorrecta')">Incorrecta</button>
            <button class="b-doubt ${v && v !== "dudosa" ? "off" : ""}" onclick="mark('${s.id}','dudosa')">Dudosa</button>
            ${v ? `<button onclick="mark('${s.id}',null)" title="Quitar">↺</button>` : ""}
          </div></div></div>`; }).join("") || '<div class="notice">Nada en este filtro.</div>'}</div>`;
  r.shots.forEach((s) => { const sel = document.getElementById("why-" + s.id); if (sel && s.label && s.label.reason) sel.value = s.label.reason; });
  window.mark = async (id, verdict) => {
    const reason = verdict === "incorrecta" ? document.getElementById("why-" + id).value : "";
    const y = window.scrollY; await post(`/api/review/${encodeURIComponent(slug)}/${id}`, {verdict, reason}); await route(); window.scrollTo(0, y);
  };
  window.fixVideo = async () => { await post(`/api/video/${encodeURIComponent(slug)}/fix`); route(); };
  if (r.job.running) schedule(route, 8000);
}

async function openIdeas(n, more = false) {

  const keep = more && box.querySelector("#ideas-list") ? box.querySelector("#ideas-list").innerHTML : "";
  box.innerHTML = `<div><div class="row" style="justify-content:space-between"><h1 style="margin:0">${title}</h1><button onclick="closeIdeas()">✕</button></div>
    <div id="ideas-list">${keep}</div><div class="notice" id="ideas-wait">Pensando ideas a partir de lo que funciona… (~20-40 s)</div></div>`;

}

      <div class="two">
        <div><label>Aspecto copiado de <span class="muted">(colores, música, gráficos)</span></label><select id="ch-base"><option value="">— el de por defecto —</option>
          ${data.channels.map((c) => `<option>${esc(c)}</option>`).join("")}</select></div>
        <div><label>Formato habitual</label><select id="ch-format"><option value="">— historia (por defecto) —</option>
          ${data.formats.map((f) => `<option>${esc(f)}</option>`).join("")}</select></div>
      </div>
      <label>Competidores <span class="muted">(@canales separados por comas; el radar mira sus vídeos que mejor van)</span></label>
      <input id="ch-comp" placeholder="@canal1, @canal2">
      <label>Búsquedas del nicho <span class="muted">(una por línea; para el radar y las ideas)</span></label>
      <textarea id="ch-queries" style="min-height:110px" placeholder="historia de marcas de coches&#10;car brand history&#10;why this car failed"></textarea>
      <label>Patrón de títulos <span class="muted">(opcional, p. ej. «marca + fracaso + cifra»)</span></label><input id="ch-pattern">
      <div class="row" style="margin-top:18px"><button class="main" id="ch-go">Crear canal</button><span id="ch-msg" class="small muted"></span></div>
    </div>`;
  $("#ch-go").onclick = async () => {
    const msg = $("#ch-msg"); msg.textContent = "Creando…";
    try {
      const r = await post("/api/channels", {name: $("#ch-name").value, about: $("#ch-about").value, base: $("#ch-base").value,
        format: $("#ch-format").value, competitors: $("#ch-comp").value, queries: $("#ch-queries").value,
        pattern: $("#ch-pattern").value, my_channel: $("#ch-mine").value});
      if ($("#ch-mine").value.trim()) await post("/api/settings", {my_channels: {[r.channel]: $("#ch-mine").value.trim()}});
      data = null; msg.textContent = `✅ Canal «${r.channel}» creado. Ya puedes elegirlo al crear un vídeo.`;
      setTimeout(() => { location.hash = "#/nuevo"; }, 1200);
    } catch (e) { msg.textContent = e.message; }
  };
}

function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(() => { if (!document.hidden) fn(); else schedule(fn, ms); }, ms); }

async function route() {
  clearTimeout(timer);
  const hash = location.hash || "#/";
  document.querySelectorAll("header nav a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === hash.split("/").slice(0, 2).join("/") || (hash === "#/" && a.getAttribute("href") === "#/")));
  try {
    if (hash.startsWith("#/video/")) await videoPage(decodeURIComponent(hash.slice(8)));
    else if (hash.startsWith("#/revisar/")) await reviewPage(decodeURIComponent(hash.slice(10)));
    else if (hash.startsWith("#/decisiones/")) await decisionsPage(decodeURIComponent(hash.slice(13)));
    else if (hash === "#/errores") await errorsPage();
    else if (hash === "#/competencia") await radarPage();
    else if (hash === "#/canal") await channelPage();
    else if (hash === "#/canal-nuevo") await newChannelPage();
    else if (hash === "#/nuevo") await newVideo();
    else if (hash === "#/estadisticas") await stats();
    else if (hash === "#/ajustes") await settingsPage();
    else await home();
    const s = data && data.service;
    $("#service").textContent = s ? (s.paused ? "⏸ en pausa" : s.watching ? "● vigilando" : "") : "";
  } catch (e) { if (e.message !== "login") $("#app").innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
}

async function start() {
  const session = await fetch("/api/session").then((r) => r.json());
  if (!session.authorised) return showLogin();
  $("#top").classList.remove("hide");
  window.onhashchange = () => { tab = "diagnosis"; route(); };
  route();
}
start();
</script>
</body>
</html>
