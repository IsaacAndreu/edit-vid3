<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
<header id="top" class="hide">
  <div class="brand"><i>▶</i>Estudio</div>
  <button class="burger" type="button" onclick="document.body.classList.toggle('menu')" aria-label="Menú">☰</button>

    <a href="#/guiones"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg></span>Guiones</a>
    <a href="#/calendario"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Calendario</a>
    <a href="#/tablero"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Tablero de ideas</a>
    <div class="sec">Crecer</div>
    <a href="#/competencia"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19.1 4.9a10 10 0 0 1 0 14.2M4.9 19.1a10 10 0 0 1 0-14.2"/></svg></span>Radar</a>

    <a href="#/piloto"><span class="ic"><svg viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-7z"/></svg></span>Piloto automático</a>

  <div class="foot"><span id="service" class="small muted"></span> <a href="#" class="small muted" id="logout" style="float:right" onclick="event.preventDefault();logout()">Salir</a></div>

<main id="app"></main>

<div id="login" class="card hide">
  <h1>Estudio de vídeos</h1>
  <label>Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:14px"><button class="main" onclick="login()">Entrar</button><span id="loginmsg" class="muted small"></span></div>
</div>

<script src="/static/js/core.js?v={{v}}"></script>
<script src="/static/js/home.js?v={{v}}"></script>
