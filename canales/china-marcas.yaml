# Perfil del canal «china-marcas»: documentales de negocio faceless, en español neutro latino, de 20-25 min. Cada
# vídeo explica cómo marcas chinas rompen el dominio de marcas históricas en un producto que la gente conoce y compra:
# una industria + un «monopolio» + cómo se rompe. Formato guerra-de-modelos (formatos/guerra-de-modelos.yaml: la
# estructura del guion, la voz, los recursos y las reglas de veracidad). Audiencia: Latinoamérica y España, 25-55
# años, consumidores y pequeños emprendedores interesados en qué se paga realmente por una marca.
# Úsalo con `canal: china-marcas` (materiales/china-marcas/config.yaml ya lo pone).
#
# PLANTILLA POR VÍDEO (rellénala en la nota de la idea antes de pedir el borrador): título / industria / marca
# histórica / marcas chinas (3-5) / tres razones / cinco comparativas de precio con fuente / caso central / objeción y
# respuesta / dato final / pregunta final.
#
# Metraje: real de YouTube (presentaciones, anuncios, fábricas, reportajes, reviews), nunca stock.
# Voz: en el estudio → Ajustes → Voces por canal → china-marcas: un narrador masculino grave en español neutro latino.

format: guerra-de-modelos

brand:                             # rojo de bandera y dorado de etiqueta de precio sobre gris carbón
  accent: "#ff3b30"                # rojo: la marca china, las cifras, los capítulos
  accent2: "#f5c542"               # dorado: la marca histórica (lado B de las comparativas)
  canvas: "#151517"
  glow: "rgba(255,59,48,0.22)"
  label: "#5c1410"
  wipe: "#ff3b30"
  panel: "#1c1c1f"
  panelRaised: "#26262a"
  muted: "#b4b4bb"
  ocean: "#101418"
  land: "#2a2d33"
  border: "rgba(255,255,255,0.3)"
  chapterStyle: numbered           # «CAPÍTULO I:» en rojo + título en blanco
  statStyle: bare                  # la cifra gigante directamente sobre la fábrica o el producto
  articleStyle: paper
  motion: editorial

graphics:
  seconds_per_graphic: 55          # vive de precios lado a lado, costes, cuotas de mercado y mapas
  max: 25                          # 20-25 min: hasta ~25 gráficos
  cover_weak: true                 # los gráficos van primero donde el metraje es flojo
  types: [compare, receipt, chart, map, kinetic, race, scale, timeline, specs]

people:
  max: 3                           # fundadores (Lei Jun, Wang Chuanfu…) con su tarjeta, si hay foto libre

pacing:
  base_seconds: 3.8                # cambio de plano cada 3-5 s

timeline:
  assets: assets/china-marcas      # assets/china-marcas/music (tensa e informativa) y /sfx; si están vacías, assets/
  music_default: intriga           # tensa e informativa bajo la voz, sube en las transiciones de capítulo
  sound_bites: 0                   # sin golpes de sonido original: en reportajes y reviews habla un presentador
  pizarra: true                    # un plano sin imagen sale en pizarra con su palabra clave, nunca vacío

# METRAJE REAL DE YOUTUBE, NUNCA STOCK: reportajes y telediarios, visitas a fábricas, presentaciones de producto,
# anuncios de las marcas, reviews y unboxings, puertos y contenedores en reportajes. Si no hay vídeo, foto de prensa
# del producto o de la marca; si tampoco, pizarra. Sin Pexels ni imágenes generadas.
fallback:
  pexels: false
  generate: false

planner:
  shots_note: |
    - METRAJE REAL, NUNCA STOCK, con la marca y el producto en la búsqueda: presentaciones y anuncios de la marca
      ('Xiaomi 14 launch event', 'BYD Seal official commercial'), visitas a sus fábricas ('BYD factory tour',
      'Xiaomi smart factory'), reportajes y telediarios ('Chinese EV exports news report 2024', 'CNBC BYD'),
      reviews y unboxings ('Xiaomi 14 review', 'iPhone vs Xiaomi camera comparison'), tiendas de la marca, puertos y
      barcos de coches ('BYD car carrier ship port'). Con el año cuando se sepa. Nunca 'stock footage', 'business
      people' ni 'money concept'.
    - CIFRAS: cada cifra fuerte en un plano "stat" con su unidad ('299 $', '42 %', '1.200 millones'), y su label de
      1-2 palabras ('el Xiaomi', 'margen'). Cada «compara esto» es una comparativa lado a lado.

judge:
  trusted_bonus: 0.05              # prioridad a medios económicos y canales oficiales de las marcas
  note: "This is a business documentary about brands. Real footage of the brand or product being narrated (launch
    events, commercials, its factories, stores, the product in use, reviews, news reports about it) is ACCEPTABLE
    for any line about that brand or its industry, even if it does not show the exact action described. Rank the
    closest one first. Reject what is off-topic, another brand when the line is about a different one, a presenter
    or reviewer talking to camera, or burned-in subtitles."
  trusted_channels: [Bloomberg, CNBC, Reuters, Wall Street Journal, Financial Times, Business Insider, The Economist,
                     DW, South China Morning Post, CGTN, Xiaomi, BYD, Apple, Samsung, Tesla, Marques Brownlee,
                     Euronews]

package:
  thumbnail_style: concept         # una sola idea: el producto histórico contra el chino, con la cifra
  hint: "dos marcas reales (la histórica y la china) o el producto, y una cifra del guion con su unidad ('299 $ vs
    1.199 $', '-75 %'). Nunca 'quebró', 'copió' o 'robó' si el guion no lo dice con su fuente. Textos de miniatura de
    0-4 palabras: 'COMPARA ESTO', 'EL CLUB SE ROMPIÓ', el precio."

ideas:
  about: "un canal de YouTube faceless en español neutro latino de documentales de negocio: cómo marcas chinas
    rompen el dominio de marcas históricas en productos que la gente conoce y compra (móviles, coches eléctricos,
    drones, electrodomésticos, ropa deportiva…), con precios lado a lado y cifras con fuente, 20-25 min"
  pattern: "marca histórica + marca china + el producto + una cifra de precio o de cuota (o 'cómo X rompió el club de Y')"
  words: 3700                      # 20.000-25.000 caracteres de guion
  my_channel: ""
  competitors: []                  # los @ de los canales que tomes de referencia, para el radar
  niches: [marcas chinas, Xiaomi contra Apple, coches eléctricos chinos, BYD, monopolios de marcas,
           cuánto cuesta fabricar, made in China]

lab:
  queries: [marcas chinas, cómo china, por qué es tan barato, xiaomi vs apple, byd vs tesla, made in china,
            cuánto cuesta fabricar]
