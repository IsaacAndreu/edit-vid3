# Perfil del canal «Reglas Invisibles»: sociedad y dinero: reglas pequeñas que dan resultados enormes (barrios que se separan solos, colas injustas). Todo simulado y dibujado en código: ni YouTube ni metraje de terceros.
# Úsalo con `canal: reglas-invisibles` en materiales/<vídeo>/config.yaml. Cada frase del guion recibe una escena
# (pipeline/simulacion.py): el mundo, dónde mira la cámara, qué panel sale y, si la frase la nombra, la fuente.
# Mundos y parámetros: remotion/sim/worlds.json. Para otro idioma, align.language (es/pt/fr/de/en) traduce los paneles.
# Lo que no se pone aquí sale de config.yaml.

visual:
  style: simulacion
  worlds: [segregacion, colas, contagio]
  theme: sepia                       # day | night | sepia (el mapa de la ciudad; los demás mundos llevan su propio fondo)

brand:
  accent: "#d4a24c"                # dorado de archivo

graphics:
  types: [chart, compare, timeline]   # los gráficos del programa, encima de la simulación, solo cuando aportan una cifra
