# «The Simulated Why» (English): el canal de simulación general en este idioma. `base: el-porque-simulado` trae todo el molde
# (mundos, aspecto, gráficos); aquí solo va lo propio: el idioma (voz, paneles, títulos y textos) y sus ideas.
# Su voz: estudio → Ajustes → Voces por canal → simulated-why.

base: el-porque-simulado

align:
  language: en

localize: |                       # cómo adaptar cada guion al público en inglés (sobre todo EE. UU.)
  Público de Estados Unidos (y quien vea en inglés). «Autovía» → freeway/interstate; el súper → grocery store
  (Walmart, Target, Costco); dólares, millas y mph. En vídeos de apagones: el gran apagón del noreste de agosto de
  2003 (Estados Unidos y Canadá). En vídeos de tráfico: varios estados hacen campañas para que la gente use la
  cremallera (zipper merge). Tono: directo y con energía, como un buen explicador de YouTube.

dubbing:                           # llega doblado desde el-porque-simulado: este canal no dobla a otros
  enabled: false

ideas:
  about: 'a YouTube channel in English: everyday things and the world explained with simulations seen from above (why jams appear out of nothing, why the other line moves faster, how a rumour or a fire spreads), ~10 min videos with an experiment you can watch'
  niches: [traffic, queues, epidemics, disasters, society, animals, everyday science]
