# «Atlas» (español): explicaciones de mapas sobre un globo dibujado en código, estilo «mira más de cerca»: página de
# papel, globo ortográfico que gira de frase en frase, rutas de círculo máximo, círculos de alcance, tarjetas de papel,
# sello, algún gráfico limpio y dibujos lineales; barra de capítulos I-V (pipeline/atlas.py → Atlas.tsx). Sin metraje:
# va por el carril rápido de la cola. Se dobla al inglés en atlas-en. Cambia el nombre en brand.name.

video:
  fps: 30

visual:
  style: atlas

brand:
  name: Atlas
  accent: "#B8322A"
  motion: clean

align:
  language: es

timeline:
  music_default: intriga
  music_volume: 0.12
  questions: false
  labels: false
  endscreen_seconds: 15

graphics:
  types: []
  extra_types: []

ideas:
  about: 'un canal de YouTube en español de explicaciones con mapas sobre un globo: por qué algo del mundo es como es (rutas que nadie vuela, fronteras, mares, climas, el sitio más remoto), con cinco razones por vídeo, datos con fuente, vídeos de 8-10 min'
  niches: [geografía, aviación, rutas, fronteras, océanos, curiosidades del mapa]
  words: 1200
  # canales del mismo formato: el radar trae cada día sus vídeos que más superan a su canal → ideas para el piloto
  competitors: ["https://www.youtube.com/channel/UCC4g8vS4FYCAELLK3AimTgQ", "@RealLifeLore", "@Wendoverproductions", "@PolyMatter"]

lab:
  queries: ["por qué los aviones no vuelan", "por qué nadie vive en", "frontera más extraña del mundo", "por qué este mapa"]

dubbing:
  enabled: true
  languages: [en]
  channels: {en: atlas-en}
  review: false

shorts:
  enabled: false
