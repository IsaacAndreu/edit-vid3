# config.local.yaml: solo para ESTA máquina (la VPS). Va encima de config.yaml y no se sube a git.
sourcing:
  youtube:
    cookies: fallback          # sin cuenta; una cookie de reserva solo para vídeos que la pidan (edad, miembros).
                               # never = nunca; rotate = todas las peticiones con cuenta, por turnos (el PC de casa)
    po_token: on               # PO Token Provider (bgutil) + cliente mweb; avisa si no está
    pot_provider_url: http://127.0.0.1:4416
    player_client: [default, web_safari]   # se añade mweb solo con el PO Token
    concurrency: 3

render:
  encoder: x264                # la VPS no tiene gráfica NVIDIA
  concurrency: 4               # pestañas de Chrome para Remotion: empieza en 4 y mira RAM/CPU (htop); sube si sobra

queue:
  parallel_videos: 1           # con 4 vCPU, de uno en uno; con 8, prueba 2

cleanup:
  after_video: true            # al terminar un vídeo, borra sus temporales pesados (render, clips, proxies del editor)
                               # y deja vídeo final, planes, logs y diagnóstico. Ojo: rehacer ese vídeo vuelve a descargar.
  cache_days: 14               # descargas de YouTube/Pexels en cache/ sin usar en 14 días → fuera
  published_days: 7            # vídeo ya subido a YouTube hace 7 días → se borran su vídeo final, previas, Shorts y clips
  min_free_gb: 30              # con menos espacio libre, se borran antes (los subidos más antiguos primero)

budget:
  daily_usd: 15                # tope de gasto de API al día (lo cambias en el estudio → Ajustes); al llegar, sigue mañana
